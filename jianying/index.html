<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- The seal, inline: no extra request, and no 404 for /favicon.ico. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23c1272d'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23e8dcc0' font-family='serif'%3E%E5%89%91%3C/text%3E%3C/svg%3E"
    />
    <title>剑影 Jiànyǐng</title>
    <style>
      :root {
        --ink: #0d0d0d;
        --paper: #e8dcc0;
        --cinnabar: #c1272d;
        --gold: #d4af37;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: var(--ink);
        color: var(--paper);
        font-family: system-ui, -apple-system, sans-serif;
        /* A game canvas must never scroll, rubber-band, or fire a text-selection
           long-press while a thumb is dragging the joystick. */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: block;
      }
      #stage canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        top: env(safe-area-inset-top, 0);
        left: env(safe-area-inset-left, 0);
        right: env(safe-area-inset-right, 0);
        padding: 10px 14px;
        pointer-events: none;
        font-variant-numeric: tabular-nums;
        font-size: 13px;
        letter-spacing: 0.02em;
        color: rgba(232, 220, 192, 0.72);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      }
      /* --- run HUD ------------------------------------------------- */
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .hud-bar {
        position: absolute;
        top: calc(env(safe-area-inset-top, 0) + 30px);
        left: 14px;
        right: 14px;
      }
      .hud-health {
        height: 5px;
        background: rgba(13, 13, 13, 0.12);
        border-radius: 3px;
        overflow: hidden;
      }
      .hud-health-fill {
        height: 100%;
        background: var(--ink);
        transform-origin: left center;
        transition:
          transform 220ms cubic-bezier(0.22, 1, 0.36, 1),
          background 300ms ease;
      }
      .hud-stats {
        display: flex;
        justify-content: space-between;
        margin-top: 6px;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        color: rgba(13, 13, 13, 0.55);
        letter-spacing: 0.04em;
      }
      .hud-kills::before {
        content: '⚔ ';
        opacity: 0.6;
      }

      /* Owned techniques, so what you have picked is always readable. */
      .hud-loadout {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 7px;
      }
      .chip {
        font-size: 10px;
        letter-spacing: 0.04em;
        padding: 2px 6px;
        border-radius: 2px;
        color: rgba(13, 13, 13, 0.62);
        background: rgba(13, 13, 13, 0.07);
        border-left: 2px solid rgba(13, 13, 13, 0.28);
      }
      .chip-art {
        color: #8a6d16;
        background: rgba(212, 175, 55, 0.14);
        border-left-color: var(--gold);
      }

      /* --- end of run ----------------------------------------------- */
      .over {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 14px;
        text-align: center;
        background: rgba(232, 220, 192, 0.9);
        backdrop-filter: blur(2px);
        pointer-events: auto;
        opacity: 0;
        transition: opacity 420ms ease;
      }
      /* A class selector beats the user-agent's [hidden] { display: none },
         so `display: grid` above would keep this panel laid out even while
         hidden — invisible at opacity 0, but still swallowing every touch
         across the whole screen. That shipped once: the game ran and the
         sword killed, but the joystick never received a single pointer. */
      .over[hidden] {
        display: none;
      }
      .over.shown {
        opacity: 1;
      }
      .over-seal {
        font-size: 40px;
        color: var(--cinnabar);
        opacity: 0.9;
      }
      .over-title {
        font-size: 19px;
        color: var(--ink);
        letter-spacing: 0.04em;
      }
      .over-rows {
        display: grid;
        gap: 6px;
        margin-top: 4px;
        font-size: 14px;
        color: rgba(13, 13, 13, 0.7);
      }
      .over-rows div {
        display: flex;
        justify-content: space-between;
        gap: 28px;
      }
      .over-rows b {
        font-variant-numeric: tabular-nums;
      }
      .over-again {
        margin-top: 14px;
        padding: 12px 26px;
        font: inherit;
        font-size: 15px;
        color: var(--paper);
        background: var(--ink);
        border: 0;
        border-radius: 2px;
        letter-spacing: 0.06em;
        cursor: pointer;
      }
      .over-again:active {
        transform: scale(0.97);
      }

      /* --- level up -------------------------------------------------- */
      .levelup {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 10px;
        padding: 0 16px calc(env(safe-area-inset-bottom, 0) + 26px);
        background: rgba(232, 220, 192, 0.93);
        backdrop-filter: blur(3px);
        pointer-events: auto;
        opacity: 0;
        transition: opacity 200ms ease;
      }
      .levelup[hidden] {
        display: none;
      }
      .levelup.shown {
        opacity: 1;
      }
      .levelup-title {
        text-align: center;
        font-size: 13px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--gold);
      }
      .levelup-sub {
        text-align: center;
        font-size: 19px;
        color: var(--ink);
        margin-bottom: 8px;
      }
      .levelup-cards {
        display: grid;
        gap: 10px;
      }
      .card {
        display: block;
        width: 100%;
        text-align: left;
        font: inherit;
        padding: 15px 16px;
        border: 1px solid rgba(13, 13, 13, 0.18);
        border-left: 3px solid var(--ink);
        border-radius: 2px;
        background: rgba(255, 252, 244, 0.72);
        cursor: pointer;
      }
      /* Arts get the gold edge: they change what the run looks like, and that
         is the choice most worth noticing at a glance. */
      .card-art {
        border-left-color: var(--gold);
        background: rgba(255, 250, 232, 0.85);
      }
      .card:active {
        transform: scale(0.985);
      }
      .card-name {
        font-size: 16px;
        color: var(--ink);
        margin-bottom: 3px;
      }
      .card-blurb {
        font-size: 13px;
        color: rgba(13, 13, 13, 0.62);
        line-height: 1.35;
      }
      .card-rank {
        margin-top: 7px;
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(13, 13, 13, 0.4);
      }
      .card-art .card-rank {
        color: var(--gold);
      }

      /* XP bar sits directly under health, thinner and gold. */
      .hud-xp {
        height: 3px;
        margin-top: 3px;
        background: rgba(13, 13, 13, 0.1);
        border-radius: 2px;
        overflow: hidden;
      }
      .hud-xp-fill {
        height: 100%;
        background: var(--gold);
        transform-origin: left center;
        transition: transform 180ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      .hud-realm {
        color: var(--gold);
      }

      #hint {
        position: fixed;
        left: 0;
        right: 0;
        bottom: calc(env(safe-area-inset-bottom, 0) + 46px);
        text-align: center;
        pointer-events: none;
        font-size: 13px;
        letter-spacing: 0.06em;
        color: var(--ink);
        opacity: 0;
        transition: opacity 700ms ease;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 8px;
        text-align: center;
        background: var(--ink);
        transition: opacity 400ms ease;
      }
      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }
      #boot .seal {
        font-size: 44px;
        color: var(--cinnabar);
        letter-spacing: 0.1em;
      }
      #boot .sub {
        font-size: 12px;
        color: rgba(232, 220, 192, 0.5);
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="hud"></div>
    <div id="ui"></div>
    <div id="hint"></div>
    <div id="boot">
      <div class="seal">剑影</div>
      <div class="sub">Jiànyǐng</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
