<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- The seal, inline: no extra request, and no 404 for /favicon.ico. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23c1272d'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23e8dcc0' font-family='serif'%3E%E5%89%91%3C/text%3E%3C/svg%3E"
    />
    <title>剑影 Jiànyǐng</title>
    <style>
      :root {
        --ink: #0d0d0d;
        --paper: #e8dcc0;
        --cinnabar: #c1272d;
        --gold: #d4af37;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: var(--ink);
        color: var(--paper);
        font-family: system-ui, -apple-system, sans-serif;
        /* A game canvas must never scroll, rubber-band, or fire a text-selection
           long-press while a thumb is dragging the joystick. */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: block;
      }
      #stage canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        top: env(safe-area-inset-top, 0);
        left: env(safe-area-inset-left, 0);
        right: env(safe-area-inset-right, 0);
        padding: 10px 14px;
        pointer-events: none;
        font-variant-numeric: tabular-nums;
        font-size: 13px;
        letter-spacing: 0.02em;
        color: rgba(232, 220, 192, 0.72);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      }
      /* --- run HUD ------------------------------------------------- */
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .hud-bar {
        position: absolute;
        top: calc(env(safe-area-inset-top, 0) + 30px);
        left: 14px;
        right: 14px;
      }
      .hud-health {
        height: 5px;
        background: rgba(13, 13, 13, 0.12);
        border-radius: 3px;
        overflow: hidden;
      }
      .hud-health-fill {
        height: 100%;
        background: var(--ink);
        transform-origin: left center;
        transition:
          transform 220ms cubic-bezier(0.22, 1, 0.36, 1),
          background 300ms ease;
      }
      .hud-stats {
        display: flex;
        justify-content: space-between;
        margin-top: 6px;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        color: rgba(13, 13, 13, 0.55);
        letter-spacing: 0.04em;
      }
      .hud-kills::before {
        content: '⚔ ';
        opacity: 0.6;
      }
      .hud-insight {
        color: var(--gold);
      }
      /* Which road you are on, always visible: depth changes the fight and a
         player who cannot see it has no way to connect difficulty to choice. */
      .hud-road {
        margin-top: 5px;
        font-size: 10px;
        letter-spacing: 0.08em;
        color: rgba(13, 13, 13, 0.42);
      }

      /* Owned techniques, so what you have picked is always readable. */
      .hud-loadout {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 7px;
      }
      .chip {
        font-size: 10px;
        letter-spacing: 0.04em;
        padding: 2px 6px;
        border-radius: 2px;
        color: rgba(13, 13, 13, 0.62);
        background: rgba(13, 13, 13, 0.07);
        border-left: 2px solid rgba(13, 13, 13, 0.28);
      }
      .chip-art {
        color: #8a6d16;
        background: rgba(212, 175, 55, 0.14);
        border-left-color: var(--gold);
      }

      /* --- end of run ----------------------------------------------- */
      .over {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        /* The reward breakdown can outgrow a short phone; it must scroll rather
           than push the Return button off the bottom of the screen. */
        overflow-y: auto;
        padding: 24px 20px calc(env(safe-area-inset-bottom, 0) + 24px);
        text-align: center;
        /* Near-opaque. At 0.9 the frozen battlefield showed through, and a
           screen whose whole job is to be read cannot have half-lit silhouettes
           behind the numbers. */
        background: rgba(232, 220, 192, 0.97);
        /* No backdrop-filter. Blurring behind a full-screen panel forces the
           compositor to read back and filter the entire WebGL canvas, which on
           a phone is among the most expensive things a page can ask for — and
           at 97% opacity there was nothing left to see through it anyway. */
        pointer-events: auto;
        opacity: 0;
        transition: opacity 420ms ease;
      }
      .over-inner {
        display: grid;
        gap: 12px;
        justify-items: center;
      }
      .over-cause {
        font-size: 13px;
        color: var(--cinnabar);
        letter-spacing: 0.04em;
      }
      .over-cause[hidden] {
        display: none;
      }

      /* The itemised conversion of an expedition into permanent progress.
         Shown in full rather than as one total, because the point is that the
         player can see which part of what they did was worth something. */
      .over-reward {
        width: min(300px, 82vw);
        margin-top: 6px;
        padding-top: 12px;
        border-top: 1px solid rgba(13, 13, 13, 0.14);
        text-align: left;
      }
      .rw-head {
        font-size: 10px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--gold);
        margin-bottom: 8px;
      }
      .rw {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        font-size: 13px;
        padding: 3px 0;
        color: rgba(13, 13, 13, 0.62);
      }
      .rw b {
        font-variant-numeric: tabular-nums;
        color: rgba(13, 13, 13, 0.8);
      }
      .rw-total {
        margin-top: 6px;
        padding-top: 7px;
        border-top: 1px solid rgba(13, 13, 13, 0.14);
        font-size: 15px;
        color: var(--ink);
      }
      .rw-total b {
        color: var(--gold);
      }
      .rw-gain,
      .rw-realm,
      .rw-road,
      .rw-points {
        margin-top: 8px;
        text-align: center;
        font-size: 13px;
      }
      .rw-gain {
        font-size: 17px;
        color: var(--ink);
      }
      .rw-realm {
        color: var(--cinnabar);
        letter-spacing: 0.04em;
      }
      .rw-road {
        color: rgba(13, 13, 13, 0.6);
      }
      .rw-points {
        color: var(--gold);
      }
      /* A class selector beats the user-agent's [hidden] { display: none },
         so `display: grid` above would keep this panel laid out even while
         hidden — invisible at opacity 0, but still swallowing every touch
         across the whole screen. That shipped once: the game ran and the
         sword killed, but the joystick never received a single pointer. */
      .over[hidden] {
        display: none;
      }
      .over.shown {
        opacity: 1;
      }
      .over-seal {
        font-size: 40px;
        color: var(--cinnabar);
        opacity: 0.9;
      }
      .over-title {
        font-size: 19px;
        color: var(--ink);
        letter-spacing: 0.04em;
      }
      .over-rows {
        display: grid;
        gap: 6px;
        margin-top: 4px;
        font-size: 14px;
        color: rgba(13, 13, 13, 0.7);
      }
      .over-rows div {
        display: flex;
        justify-content: space-between;
        gap: 28px;
      }
      .over-rows b {
        font-variant-numeric: tabular-nums;
      }
      .over-again {
        margin-top: 14px;
        padding: 12px 26px;
        font: inherit;
        font-size: 15px;
        color: var(--paper);
        background: var(--ink);
        border: 0;
        border-radius: 2px;
        letter-spacing: 0.06em;
        cursor: pointer;
      }
      .over-again:active {
        transform: scale(0.97);
      }

      /* --- level up -------------------------------------------------- */
      .levelup {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 10px;
        padding: 0 16px calc(env(safe-area-inset-bottom, 0) + 26px);
        /* Raised from 0.93 and the blur dropped — see .over above for why. This
           panel appears about five times an expedition, and each appearance was
           asking the compositor to filter the whole canvas. */
        background: rgba(232, 220, 192, 0.97);
        pointer-events: auto;
        opacity: 0;
        transition: opacity 200ms ease;
      }
      .levelup[hidden] {
        display: none;
      }
      .levelup.shown {
        opacity: 1;
      }
      .levelup-title {
        text-align: center;
        font-size: 13px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--gold);
      }
      .levelup-sub {
        text-align: center;
        font-size: 19px;
        color: var(--ink);
        margin-bottom: 8px;
      }
      .levelup-cards {
        display: grid;
        gap: 10px;
      }
      .card {
        display: block;
        width: 100%;
        text-align: left;
        font: inherit;
        padding: 15px 16px;
        border: 1px solid rgba(13, 13, 13, 0.18);
        border-left: 3px solid var(--ink);
        border-radius: 2px;
        background: rgba(255, 252, 244, 0.72);
        cursor: pointer;
      }
      /* Arts get the gold edge: they change what the run looks like, and that
         is the choice most worth noticing at a glance. */
      .card-art {
        border-left-color: var(--gold);
        background: rgba(255, 250, 232, 0.85);
      }
      .card:active {
        transform: scale(0.985);
      }
      .card-name {
        font-size: 16px;
        color: var(--ink);
        margin-bottom: 3px;
      }
      .card-blurb {
        font-size: 13px;
        color: rgba(13, 13, 13, 0.62);
        line-height: 1.35;
      }
      .card-rank {
        margin-top: 7px;
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(13, 13, 13, 0.4);
      }
      .card-art .card-rank {
        color: var(--gold);
      }

      /* XP bar sits directly under health, thinner and gold. */
      .hud-xp {
        height: 3px;
        margin-top: 3px;
        background: rgba(13, 13, 13, 0.1);
        border-radius: 2px;
        overflow: hidden;
      }
      .hud-xp-fill {
        height: 100%;
        background: var(--gold);
        transform-origin: left center;
        transition: transform 180ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      .hud-realm {
        color: var(--gold);
      }

      /* --- banners ---------------------------------------------------- */
      /* One line, centre screen, gone in two seconds. Peripherally legible and
         demanding nothing, which is the only kind of text that can be read
         during a fight. */
      .banner {
        position: absolute;
        top: 24%;
        left: 0;
        right: 0;
        text-align: center;
        pointer-events: none;
        opacity: 0;
        transform: translateY(6px);
        transition:
          opacity 220ms ease,
          transform 320ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      .banner[hidden] {
        display: none;
      }
      .banner.shown {
        opacity: 1;
        transform: translateY(0);
      }
      .banner-main {
        font-size: 21px;
        letter-spacing: 0.06em;
        color: var(--ink);
        text-shadow: 0 1px 6px rgba(232, 220, 192, 0.8);
      }
      .banner-sub {
        margin-top: 2px;
        font-size: 12px;
        letter-spacing: 0.2em;
        color: rgba(13, 13, 13, 0.5);
      }
      .banner-danger .banner-main,
      .banner-danger .banner-sub {
        color: var(--cinnabar);
      }
      .banner-gold .banner-main {
        color: #8a6d16;
      }

      /* --- shared full-screen panels ---------------------------------- */
      /* A class selector beats the UA's [hidden] { display: none }. Getting
         this wrong once shipped a full-screen invisible panel that swallowed
         every touch while the game ran perfectly underneath it — so every
         panel below carries its own [hidden] rule. */
      .title,
      .create,
      .codex {
        position: absolute;
        inset: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: calc(env(safe-area-inset-top, 0) + 28px) 20px
          calc(env(safe-area-inset-bottom, 0) + 28px);
        background: var(--paper);
        color: var(--ink);
        pointer-events: auto;
        opacity: 0;
        transition: opacity 320ms ease;
      }
      .title[hidden],
      .create[hidden],
      .codex[hidden] {
        display: none;
      }
      .title.shown,
      .create.shown,
      .codex.shown {
        opacity: 1;
      }

      /* --- title ------------------------------------------------------ */
      .title {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 18px;
        text-align: center;
        /* The one screen that keeps the ink ground: it is a cover, not a
           document, and the seal has to carry it. */
        background: var(--ink);
        color: var(--paper);
      }
      .title-seal {
        font-size: 62px;
        letter-spacing: 0.12em;
        color: var(--cinnabar);
      }
      .title-roman {
        margin-top: 6px;
        font-size: 13px;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: rgba(232, 220, 192, 0.55);
      }
      .title-pitch {
        max-width: 300px;
        font-size: 14px;
        line-height: 1.6;
        color: rgba(232, 220, 192, 0.72);
      }
      .title-go {
        margin-top: 12px;
        padding: 15px 46px;
        font: inherit;
        font-size: 15px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--ink);
        background: var(--paper);
        border: 0;
        border-radius: 3px;
        cursor: pointer;
      }
      .title-go:active {
        transform: scale(0.97);
      }
      .title-who {
        font-size: 12px;
        letter-spacing: 0.1em;
        color: rgba(232, 220, 192, 0.42);
      }

      /* --- character creation ------------------------------------------ */
      .create-title {
        font-size: 22px;
        letter-spacing: 0.03em;
      }
      .create-sub {
        margin-top: 4px;
        font-size: 12px;
        line-height: 1.45;
        color: rgba(13, 13, 13, 0.5);
      }
      .create-section {
        margin: 20px 0 8px;
        font-size: 11px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(13, 13, 13, 0.45);
      }
      .create-name {
        display: flex;
        gap: 8px;
      }
      .create-input {
        flex: 1;
        min-width: 0;
        min-height: 46px;
        padding: 0 12px;
        font: inherit;
        font-size: 16px; /* 16px or iOS zooms the viewport on focus. */
        color: var(--ink);
        background: rgba(255, 252, 244, 0.7);
        border: 1px solid rgba(13, 13, 13, 0.18);
        border-radius: 2px;
      }
      .create-roll {
        flex: none;
        width: 52px;
        min-height: 46px;
        font-size: 19px;
        color: var(--paper);
        background: var(--ink);
        border: 0;
        border-radius: 2px;
        cursor: pointer;
      }
      .create-roll:active {
        transform: scale(0.95);
      }

      .origin {
        display: flex;
        gap: 12px;
        width: 100%;
        margin-bottom: 8px;
        padding: 13px 14px;
        text-align: left;
        font: inherit;
        background: rgba(255, 252, 244, 0.55);
        border: 1px solid rgba(13, 13, 13, 0.12);
        border-left: 3px solid rgba(13, 13, 13, 0.16);
        border-radius: 2px;
        cursor: pointer;
      }
      .origin-on {
        background: rgba(255, 250, 232, 0.92);
        border-left-color: var(--cinnabar);
      }
      .origin-seal {
        flex: none;
        width: 40px;
        height: 40px;
        display: grid;
        place-content: center;
        font-size: 13px;
        line-height: 1.15;
        text-align: center;
        color: rgba(13, 13, 13, 0.6);
        background: rgba(13, 13, 13, 0.06);
        border-radius: 2px;
      }
      .origin-on .origin-seal {
        color: var(--paper);
        background: var(--cinnabar);
      }
      .origin-text {
        flex: 1;
        min-width: 0;
      }
      .origin-name {
        font-size: 15px;
      }
      /* The weapon leads on a school card: it is the part of the choice the
         player feels within a second of setting out. */
      .origin-weapon {
        margin-top: 3px;
        font-size: 13px;
        color: var(--cinnabar);
      }
      .origin-effect {
        margin-top: 3px;
        font-size: 12px;
        line-height: 1.4;
        color: #8a6d16;
      }
      .origin-blurb {
        margin-top: 5px;
        font-size: 12px;
        line-height: 1.45;
        color: rgba(13, 13, 13, 0.5);
      }

      /* --- equipment ---------------------------------------------------- */
      .slot {
        margin-bottom: 12px;
      }
      .slot-name {
        font-size: 11px;
        letter-spacing: 0.1em;
        color: rgba(13, 13, 13, 0.4);
        margin-bottom: 5px;
      }
      /* Horizontal and scrollable, so a slot with eight options costs one row
         of height instead of eight. */
      .slot-items {
        display: flex;
        gap: 7px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 3px;
      }
      .item {
        flex: none;
        width: 158px;
        min-height: 58px;
        padding: 9px 11px;
        text-align: left;
        font: inherit;
        color: var(--ink);
        background: rgba(255, 252, 244, 0.5);
        border: 1px solid rgba(13, 13, 13, 0.12);
        border-left: 3px solid rgba(13, 13, 13, 0.14);
        border-radius: 2px;
        cursor: pointer;
      }
      .item-r1 {
        border-left-color: var(--gold);
      }
      .item-r2 {
        border-left-color: var(--cinnabar);
      }
      .item-worn {
        background: rgba(13, 13, 13, 0.9);
        color: var(--paper);
      }
      .item:not(.item-worn):active {
        transform: scale(0.97);
      }
      .item-name {
        font-size: 13px;
      }
      .item-line {
        margin-top: 3px;
        font-size: 11px;
        line-height: 1.35;
        color: rgba(13, 13, 13, 0.55);
      }
      .item-worn .item-line {
        color: rgba(232, 220, 192, 0.62);
      }

      /* Loot on the reward screen. */
      .rw-found {
        margin-top: 14px;
      }
      .loot {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        padding: 3px 0;
        font-size: 13px;
        color: var(--ink);
      }
      .loot b {
        color: #8a6d16;
        font-weight: normal;
        text-align: right;
      }
      .loot-dupe,
      .loot-dupe b {
        color: rgba(13, 13, 13, 0.35);
      }
      .create-go {
        display: block;
        width: 100%;
        margin-top: 18px;
        padding: 16px;
        font: inherit;
        font-size: 16px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--paper);
        background: var(--ink);
        border: 0;
        border-radius: 3px;
        cursor: pointer;
      }
      .create-go:active {
        transform: scale(0.985);
      }

      /* --- codex -------------------------------------------------------- */
      .codex-title {
        font-size: 21px;
        margin-bottom: 18px;
      }
      .codex-entry {
        display: flex;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid rgba(13, 13, 13, 0.08);
      }
      .codex-seal {
        flex: none;
        width: 26px;
        font-size: 17px;
        color: var(--cinnabar);
        text-align: center;
      }
      .codex-head {
        font-size: 14px;
        line-height: 1.35;
      }
      .codex-text {
        margin-top: 4px;
        font-size: 13px;
        line-height: 1.5;
        color: rgba(13, 13, 13, 0.58);
      }
      .codex-go {
        display: block;
        width: 100%;
        margin-top: 20px;
        padding: 15px;
        font: inherit;
        font-size: 15px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--paper);
        background: var(--ink);
        border: 0;
        border-radius: 3px;
        cursor: pointer;
      }

      /* --- hub -------------------------------------------------------- */
      .hub {
        position: absolute;
        inset: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: calc(env(safe-area-inset-top, 0) + 26px) 18px
          calc(env(safe-area-inset-bottom, 0) + 26px);
        background: var(--paper);
        color: var(--ink);
        pointer-events: auto;
        opacity: 0;
        transition: opacity 300ms ease;
      }
      /* A class selector beats the UA's [hidden] { display: none }. Getting
         this wrong once shipped a full-screen invisible panel that swallowed
         every touch while the game ran perfectly underneath it. */
      .hub[hidden] {
        display: none;
      }
      .hub.shown {
        opacity: 1;
      }

      .hub-head {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .hub-seal {
        flex: none;
        width: 62px;
        height: 62px;
        display: grid;
        place-content: center;
        font-size: 21px;
        line-height: 1.15;
        text-align: center;
        color: var(--paper);
        background: var(--cinnabar);
        border-radius: 3px;
        letter-spacing: 0;
      }
      .hub-ident {
        flex: 1;
        min-width: 0;
      }
      /* The name leads. A panel that opens on a rank describes a rank; one
         that opens on a name describes somebody the numbers belong to. */
      .hub-name {
        font-size: 20px;
        letter-spacing: 0.02em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .hub-origin {
        margin-top: 2px;
        font-size: 12px;
        color: var(--cinnabar);
        letter-spacing: 0.03em;
      }
      .hub-realm {
        margin-top: 4px;
        font-size: 13px;
        color: rgba(13, 13, 13, 0.55);
      }
      .hub-level {
        margin-left: 6px;
        color: var(--gold);
        font-variant-numeric: tabular-nums;
      }
      .hub-step {
        margin-left: 5px;
        color: rgba(13, 13, 13, 0.35);
        font-variant-numeric: tabular-nums;
      }
      .hub-codex {
        flex: none;
        width: 34px;
        height: 34px;
        align-self: flex-start;
        font: inherit;
        font-size: 15px;
        color: rgba(13, 13, 13, 0.45);
        background: rgba(13, 13, 13, 0.06);
        border: 0;
        border-radius: 50%;
        cursor: pointer;
      }
      .hub-codex:active {
        transform: scale(0.94);
      }

      .hub-cult {
        margin-top: 16px;
      }
      .hub-cult-row {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(13, 13, 13, 0.45);
      }
      .hub-cult-row b {
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
        text-transform: none;
      }
      .hub-cult-track {
        margin-top: 5px;
        height: 5px;
        background: rgba(13, 13, 13, 0.1);
        border-radius: 3px;
        overflow: hidden;
      }
      .hub-cult-fill {
        height: 100%;
        background: var(--gold);
        transform-origin: left center;
        transition: transform 320ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .hub-section {
        margin-top: 22px;
      }
      .hub-section-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 11px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(13, 13, 13, 0.45);
        margin-bottom: 8px;
      }
      .hub-points {
        letter-spacing: 0.04em;
        text-transform: none;
        font-size: 12px;
        color: var(--gold);
      }

      .attr {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 9px 0;
        border-bottom: 1px solid rgba(13, 13, 13, 0.08);
      }
      .attr-seal {
        flex: none;
        width: 32px;
        height: 32px;
        display: grid;
        place-content: center;
        font-size: 17px;
        color: rgba(13, 13, 13, 0.66);
        background: rgba(13, 13, 13, 0.06);
        border-radius: 2px;
      }
      .attr-text {
        flex: 1;
        min-width: 0;
      }
      .attr-name {
        font-size: 14px;
      }
      .attr-rank {
        margin-left: 4px;
        font-size: 12px;
        color: var(--gold);
        font-variant-numeric: tabular-nums;
      }
      /* What equipment is adding, kept separate from what was bought — so a
         player can see what a swap would cost them. */
      .attr-gear {
        margin-left: 3px;
        font-size: 12px;
        color: var(--cinnabar);
        font-variant-numeric: tabular-nums;
      }
      .attr-now {
        margin-top: 1px;
        font-size: 12px;
        color: rgba(13, 13, 13, 0.5);
        font-variant-numeric: tabular-nums;
      }
      /* Thumb-sized, and carrying its own consequence: the number it would
         produce is printed on the button you are about to press. */
      .attr-add {
        flex: none;
        min-width: 62px;
        min-height: 44px;
        display: grid;
        place-content: center;
        gap: 1px;
        font: inherit;
        color: var(--paper);
        background: var(--ink);
        border: 0;
        border-radius: 3px;
        cursor: pointer;
      }
      .attr-add:disabled {
        color: rgba(13, 13, 13, 0.22);
        background: rgba(13, 13, 13, 0.06);
        cursor: default;
      }
      .attr-add:not(:disabled):active {
        transform: scale(0.96);
      }
      .attr-plus {
        font-size: 15px;
        line-height: 1;
      }
      .attr-next {
        font-size: 10px;
        opacity: 0.72;
        font-variant-numeric: tabular-nums;
      }

      .road-pips {
        display: flex;
        gap: 6px;
        margin-bottom: 10px;
      }
      .pip {
        flex: 1;
        min-height: 38px;
        font: inherit;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        color: rgba(13, 13, 13, 0.55);
        background: rgba(13, 13, 13, 0.06);
        border: 1px solid transparent;
        border-radius: 2px;
        cursor: pointer;
      }
      .pip-on {
        color: var(--paper);
        background: var(--ink);
      }
      .pip-locked {
        color: rgba(13, 13, 13, 0.18);
        background: transparent;
        border-color: rgba(13, 13, 13, 0.08);
        cursor: default;
      }
      .road-card {
        padding: 12px 14px;
        background: rgba(255, 252, 244, 0.66);
        border-left: 3px solid var(--cinnabar);
        border-radius: 2px;
      }
      .road-name {
        font-size: 15px;
      }
      .road-seal {
        color: var(--cinnabar);
        margin-right: 4px;
      }
      .road-blurb {
        margin-top: 3px;
        font-size: 12px;
        line-height: 1.4;
        color: rgba(13, 13, 13, 0.55);
      }
      .road-reward {
        margin-top: 7px;
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--gold);
      }

      .hub-go {
        display: block;
        width: 100%;
        margin-top: 22px;
        padding: 16px;
        font: inherit;
        font-size: 16px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--paper);
        background: var(--ink);
        border: 0;
        border-radius: 3px;
        cursor: pointer;
      }
      .hub-go:active {
        transform: scale(0.985);
      }
      .hub-totals {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 8px 16px;
        margin-top: 16px;
        font-size: 11px;
        color: rgba(13, 13, 13, 0.4);
      }
      .hub-totals b {
        color: rgba(13, 13, 13, 0.62);
        font-variant-numeric: tabular-nums;
      }

      #hint {
        position: fixed;
        left: 0;
        right: 0;
        bottom: calc(env(safe-area-inset-bottom, 0) + 46px);
        text-align: center;
        pointer-events: none;
        font-size: 13px;
        letter-spacing: 0.06em;
        color: var(--ink);
        opacity: 0;
        transition: opacity 700ms ease;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 8px;
        text-align: center;
        background: var(--ink);
        transition: opacity 400ms ease;
      }
      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }
      #boot .seal {
        font-size: 44px;
        color: var(--cinnabar);
        letter-spacing: 0.1em;
      }
      #boot .sub {
        font-size: 12px;
        color: rgba(232, 220, 192, 0.5);
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="hud"></div>
    <div id="ui"></div>
    <div id="hint"></div>
    <div id="boot">
      <div class="seal">剑影</div>
      <div class="sub">Jiànyǐng</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
