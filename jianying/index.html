<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- The seal, inline: no extra request, and no 404 for /favicon.ico. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23c1272d'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23e8dcc0' font-family='serif'%3E%E5%89%91%3C/text%3E%3C/svg%3E"
    />
    <title>剑影 Jiànyǐng</title>
    <style>
      :root {
        --ink: #0d0d0d;
        --paper: #e8dcc0;
        --cinnabar: #c1272d;
        --gold: #d4af37;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: var(--ink);
        color: var(--paper);
        font-family: system-ui, -apple-system, sans-serif;
        /* A game canvas must never scroll, rubber-band, or fire a text-selection
           long-press while a thumb is dragging the joystick. */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: block;
      }
      #stage canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        top: env(safe-area-inset-top, 0);
        left: env(safe-area-inset-left, 0);
        right: env(safe-area-inset-right, 0);
        padding: 10px 14px;
        pointer-events: none;
        font-variant-numeric: tabular-nums;
        font-size: 13px;
        letter-spacing: 0.02em;
        color: rgba(232, 220, 192, 0.72);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      }
      #hint {
        position: fixed;
        left: 0;
        right: 0;
        bottom: calc(env(safe-area-inset-bottom, 0) + 46px);
        text-align: center;
        pointer-events: none;
        font-size: 13px;
        letter-spacing: 0.06em;
        color: var(--ink);
        opacity: 0;
        transition: opacity 700ms ease;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 8px;
        text-align: center;
        background: var(--ink);
        transition: opacity 400ms ease;
      }
      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }
      #boot .seal {
        font-size: 44px;
        color: var(--cinnabar);
        letter-spacing: 0.1em;
      }
      #boot .sub {
        font-size: 12px;
        color: rgba(232, 220, 192, 0.5);
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="hud"></div>
    <div id="hint"></div>
    <div id="boot">
      <div class="seal">剑影</div>
      <div class="sub">Jiànyǐng</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
