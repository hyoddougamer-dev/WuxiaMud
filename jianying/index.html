<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- The seal, inline: no extra request, and no 404 for /favicon.ico. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23c1272d'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23e8dcc0' font-family='serif'%3E%E5%89%91%3C/text%3E%3C/svg%3E"
    />
    <title>剑影 Jiànyǐng</title>
    <style>
      :root {
        --ink: #0d0d0d;
        --paper: #e8dcc0;
        --cinnabar: #c1272d;
        --gold: #d4af37;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: var(--ink);
        color: var(--paper);
        font-family: system-ui, -apple-system, sans-serif;
        /* A game canvas must never scroll, rubber-band, or fire a text-selection
           long-press while a thumb is dragging the joystick. */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: block;
      }
      #stage canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        top: env(safe-area-inset-top, 0);
        left: env(safe-area-inset-left, 0);
        right: env(safe-area-inset-right, 0);
        padding: 10px 14px;
        pointer-events: none;
        font-variant-numeric: tabular-nums;
        font-size: 13px;
        letter-spacing: 0.02em;
        color: rgba(232, 220, 192, 0.72);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      }
      /* --- run HUD -----------------------------------------------------
         剑影's combat screen — "C 底", the console. Everything a player
         needs to read mid-fight sits in one block at the FOOT of the phone,
         above the thumb: HP over its bar, the art strip, 感悟 under it. The
         top half of the screen is deliberately empty — nothing is ever read
         there while something is chasing you, so nothing lives there. The
         region's name and rule are announced once, as a banner, at the start
         of the expedition, rather than sitting in a corner for the whole run. */
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .hud-bar {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: calc(env(safe-area-inset-bottom, 0) + 96px);
      }
      /* 闪 — o botão de esquiva.
         À DIREITA e à altura do joystick, que é o único sítio onde um segundo
         polegar chega sem largar o movimento. 76px, muito acima do mínimo de
         44, porque isto é premido em pânico e um toque falhado é uma morte.
         O mostrador é um círculo tracejado cujo deslocamento é a carga, por
         isso encher custa um atributo por frame e não um redesenho. */
      .hud-dodge {
        /* ABSOLUTE, not fixed. Anchored to #ui — the game's own frame —
           rather than to the browser window. With `fixed` the button escaped
           the game's screen anywhere that screen does not fill the window,
           which is exactly what a desktop does. Every other part of the HUD
           already used `absolute`; this was the one outlier, and the only one
           that fled. */
        position: absolute;
        right: calc(env(safe-area-inset-right, 0px) + 22px);
        /* Above the HUD bar, not on top of it: at 168px the button sat over
           the run clock. The bar lives at 96px and stands about 130px tall with
           the art strip, so 246 clears it and still falls under the thumb. */
        bottom: calc(env(safe-area-inset-bottom, 0px) + 246px);
        width: 76px;
        height: 76px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: rgba(232, 220, 192, 0.14);
        display: grid;
        place-items: center;
        pointer-events: auto;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
        cursor: pointer;
        transition: transform 90ms ease, background 140ms ease;
      }
      .hud-dodge:active { transform: scale(0.92); }
      .hud-dodge.is-ready { background: rgba(232, 220, 192, 0.26); }
      .hud-dodge-dial {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        /* Starts at the top and fills clockwise, the way a dial is read
           everywhere else. */
        transform: rotate(-90deg);
      }
      .hud-dodge-track {
        fill: none;
        stroke: rgba(13, 13, 13, 0.16);
        stroke-width: 3;
      }
      .hud-dodge-fill {
        fill: none;
        stroke: var(--paper);
        stroke-width: 3;
        stroke-linecap: round;
        opacity: 0.55;
      }
      .hud-dodge.is-ready .hud-dodge-fill {
        stroke: var(--cinnabar);
        opacity: 1;
      }
      .hud-dodge-seal {
        font-size: 26px;
        font-weight: 600;
        color: rgba(13, 13, 13, 0.5);
        line-height: 1;
        transition: color 140ms ease;
      }
      .hud-dodge.is-ready .hud-dodge-seal { color: var(--ink); }

      .hud-console {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 6px;
        font-variant-numeric: tabular-nums;
      }
      .hud-hp {
        font-size: 15px;
        font-weight: 600;
        color: var(--ink);
      }
      .hud-time {
        font-size: 12px;
        color: rgba(13, 13, 13, 0.45);
      }
      .hud-health {
        height: 6px;
        background: rgba(13, 13, 13, 0.1);
        border-radius: 3px;
        overflow: hidden;
      }
      .hud-health-fill {
        height: 100%;
        /* Ink at full health; the script switches this to cinnabar below 30% —
           see ui/hud.ts. A bar that is always red stops being a warning. */
        background: var(--ink);
        transform-origin: left center;
        transition:
          transform 220ms cubic-bezier(0.22, 1, 0.36, 1),
          background 300ms ease;
      }

      /* --- end of run ----------------------------------------------- */
      .over {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        /* The reward breakdown can outgrow a short phone; it must scroll rather
           than push the Return button off the bottom of the screen. */
        overflow-y: auto;
        padding: 24px 20px calc(env(safe-area-inset-bottom, 0) + 24px);
        text-align: center;
        /* Near-opaque. At 0.9 the frozen battlefield showed through, and a
           screen whose whole job is to be read cannot have half-lit silhouettes
           behind the numbers. */
        background: rgba(232, 220, 192, 0.97);
        /* No backdrop-filter. Blurring behind a full-screen panel forces the
           compositor to read back and filter the entire WebGL canvas, which on
           a phone is among the most expensive things a page can ask for — and
           at 97% opacity there was nothing left to see through it anyway. */
        pointer-events: auto;
        opacity: 0;
        transition: opacity 420ms ease;
      }
      .over-inner {
        display: grid;
        gap: 12px;
        justify-items: center;
      }
      .over-cause {
        font-size: 13px;
        color: var(--cinnabar);
        letter-spacing: 0.04em;
      }
      .over-cause[hidden] {
        display: none;
      }

      /* The itemised conversion of an expedition into permanent progress.
         Shown in full rather than as one total, because the point is that the
         player can see which part of what they did was worth something. */
      .over-reward {
        width: min(320px, 88vw);
        margin-top: 8px;
        padding-top: 14px;
        border-top: 1px solid rgba(13, 13, 13, 0.14);
        text-align: left;
      }
      .rw-head {
        font-size: 10px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--gold);
        margin-bottom: 8px;
      }
      /* What it was WORTH, as the headline. One number, then where it came
         from as chips that can be skipped — instead of four more rows of the
         same weight as everything else. */
      .rw-total-block {
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 8px;
      }
      .rw-total-n {
        font-size: 30px;
        font-weight: 600;
        line-height: 1;
        color: var(--gold);
        font-variant-numeric: tabular-nums;
      }
      .rw-total-label {
        font-size: 10px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(13, 13, 13, 0.45);
      }
      .rw-chips {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 5px;
        margin: 9px 0 2px;
      }
      .rw-chip {
        display: inline-flex;
        align-items: baseline;
        gap: 4px;
        padding: 2px 7px;
        border-radius: 9px;
        background: rgba(13, 13, 13, 0.05);
        font-size: 10.5px;
        color: rgba(13, 13, 13, 0.5);
      }
      .rw-chip i {
        font-style: normal;
        font-weight: 600;
        color: rgba(13, 13, 13, 0.72);
        font-variant-numeric: tabular-nums;
      }
      .rw-gain,
      .rw-realm,
      .rw-road,
      .rw-points {
        margin-top: 8px;
        text-align: center;
        font-size: 13px;
      }
      .rw-gain {
        font-size: 17px;
        color: var(--ink);
      }
      .rw-realm {
        color: var(--cinnabar);
        letter-spacing: 0.04em;
      }
      .rw-road {
        color: rgba(13, 13, 13, 0.6);
      }
      .rw-points {
        color: var(--gold);
      }
      /* A class selector beats the user-agent's [hidden] { display: none },
         so `display: grid` above would keep this panel laid out even while
         hidden — invisible at opacity 0, but still swallowing every touch
         across the whole screen. That shipped once: the game ran and the
         sword killed, but the joystick never received a single pointer. */
      .over[hidden] {
        display: none;
      }
      .over.shown {
        opacity: 1;
      }
      .over-seal {
        font-size: 40px;
        color: var(--cinnabar);
        opacity: 0.9;
      }
      .over-title {
        font-size: 19px;
        color: var(--ink);
        letter-spacing: 0.04em;
      }
      /* What the player DID, in two numbers large enough to be the first
         thing read. They were label/value rows of the same weight as the five
         below them, which is how the whole screen ended up with no hierarchy
         at all. */
      .over-rows {
        display: flex;
        gap: 30px;
        margin-top: 6px;
      }
      .over-stat {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
      }
      .over-stat b {
        font-size: 27px;
        font-weight: 600;
        line-height: 1.05;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      .over-stat span {
        font-size: 9.5px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(13, 13, 13, 0.42);
      }
      .over-again {
        margin-top: 14px;
        padding: 12px 26px;
        font: inherit;
        font-size: 15px;
        color: var(--paper);
        background: var(--ink);
        border: 0;
        border-radius: 2px;
        letter-spacing: 0.06em;
        cursor: pointer;
      }
      .over-again:active {
        transform: scale(0.97);
      }

      /* --- the rift's gate --------------------------------------------
         Shown once a floor's boss falls. Two choices, both large and
         thumb-height for the same reason the level-up cards it replaces were:
         one hand, just out of a fight. */
      .gate {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 10px;
        padding: 0 16px calc(env(safe-area-inset-bottom, 0) + 26px);
        background: rgba(232, 220, 192, 0.97);
        pointer-events: auto;
        opacity: 0;
        transition: opacity 200ms ease;
      }
      .gate[hidden] {
        display: none;
      }
      .gate.shown {
        opacity: 1;
      }
      .gate-title {
        text-align: center;
        font-size: 13px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--cinnabar);
      }
      .gate-sub {
        text-align: center;
        font-size: 14px;
        color: rgba(13, 13, 13, 0.55);
        margin-bottom: 10px;
      }
      .gate-choices {
        display: grid;
        gap: 10px;
      }
      .gate-choice {
        display: block;
        width: 100%;
        text-align: left;
        font: inherit;
        padding: 15px 16px;
        border: 1px solid rgba(13, 13, 13, 0.18);
        border-left: 3px solid var(--ink);
        border-radius: 2px;
        background: rgba(255, 252, 244, 0.72);
        cursor: pointer;
      }
      /* Pushing deeper gets the gold edge — it is the choice that changes
         what happens next, same as an art used to on the card it replaces. */
      .gate-push {
        border-left-color: var(--gold);
        background: rgba(255, 250, 232, 0.85);
      }
      .gate-choice:active {
        transform: scale(0.985);
      }
      .gate-choice-name {
        font-size: 16px;
        color: var(--ink);
        margin-bottom: 3px;
      }
      .gate-choice-note {
        font-size: 13px;
        color: rgba(13, 13, 13, 0.62);
        line-height: 1.35;
      }

      /* 感悟, thinner and gold, directly under the strip — the last thing the
         console shows because it is the one the thumb never has to act on,
         only glance at. No number: the only question worth an exact answer is
         "how close", and a bar says that on its own. */
      .hud-xp {
        height: 3px;
        margin-top: 11px;
        background: rgba(13, 13, 13, 0.1);
        border-radius: 2px;
        overflow: hidden;
      }
      .hud-xp-fill {
        height: 100%;
        background: var(--gold);
        transform-origin: left center;
        transition: transform 180ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      .hud-realm {
        color: var(--gold);
      }

      /* --- banners ---------------------------------------------------- */
      /* One line, centre screen, gone in two seconds. Peripherally legible and
         demanding nothing, which is the only kind of text that can be read
         during a fight. */
      .banner {
        position: absolute;
        top: 24%;
        left: 0;
        right: 0;
        text-align: center;
        pointer-events: none;
        opacity: 0;
        transform: translateY(6px);
        transition:
          opacity 220ms ease,
          transform 320ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      .banner[hidden] {
        display: none;
      }
      .banner.shown {
        opacity: 1;
        transform: translateY(0);
      }
      .banner-main {
        font-size: 21px;
        letter-spacing: 0.06em;
        color: var(--ink);
        text-shadow: 0 1px 6px rgba(232, 220, 192, 0.8);
      }
      .banner-sub {
        margin-top: 2px;
        font-size: 12px;
        letter-spacing: 0.2em;
        color: rgba(13, 13, 13, 0.5);
      }
      /* A sentence rather than a label — see paint() in ui/banner.ts. Normal
         tracking, a measure that fits a phone, and room for two lines. */
      .banner-say {
        max-width: 19rem;
        margin: 3px auto 0;
        letter-spacing: 0.01em;
        line-height: 1.4;
        font-size: 12.5px;
        color: rgba(13, 13, 13, 0.62);
      }
      .banner-danger .banner-main,
      .banner-danger .banner-sub {
        color: var(--cinnabar);
      }
      .banner-gold .banner-main {
        color: #8a6d16;
      }

      /* --- shared full-screen panels ---------------------------------- */
      /* A class selector beats the UA's [hidden] { display: none }. Getting
         this wrong once shipped a full-screen invisible panel that swallowed
         every touch while the game ran perfectly underneath it — so every
         panel below carries its own [hidden] rule. */
      .title,
      .codex {
        position: absolute;
        inset: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: calc(env(safe-area-inset-top, 0) + 28px) 20px
          calc(env(safe-area-inset-bottom, 0) + 28px);
        background: var(--paper);
        color: var(--ink);
        pointer-events: auto;
        opacity: 0;
        transition: opacity 320ms ease;
      }
      /* Creation is a column, not a scroll: the swordsman is pinned at the top
         and the controls scroll beneath, so the figure you are shaping never
         leaves the screen while you shape it. */
      /* The creation screen is a PAINTING, not a form on paper.
         The road art is a real ink wash of the 官道, and the swordsman being
         made stands on that road in the foreground — the small traveller in the
         painting reads as somebody further along the same road, which is
         exactly the fiction. Everything else is laid over the empty half of the
         composition, which the painter left bare. */
      .create {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        pointer-events: auto;
        opacity: 0;
        transition: opacity 320ms ease;
      }
      /* The art, and the veil that keeps text on it readable. Two layers rather
         than one image with baked-in fade: the veil has to strengthen toward
         the bottom, where the controls are, while the top stays clean sky. */
      /* A BAND, not the whole screen. The painting's composition is empty sky on
         top and the road, the sun and the ruined gate along the bottom — so
         covering the screen and then veiling the bottom for legibility hid the
         only part worth showing and left a page of blank sky. Cropping the art
         to the upper band instead lands its foreground exactly where the
         swordsman's feet are, and leaves clean paper below for the controls. */
      /* The art belongs to the STAGE, not to the whole screen. Pinned to the
         screen it ran under the copy and the controls, and no veil fixes that:
         either the painting is subdued into wallpaper or the text sits on a
         road and a ruined gate. Bounded to the band the swordsman stands in, it
         stays a painting and everything below it is clean paper.
         `cover` on a band this shape crops to the image's bottom half, which is
         exactly the half with the horizon, the sun, the gate and the road. */
      /* The painting lives on ::before and not on the element itself, because a
         filter on the element would take the swordsman standing in front of it
         with it — and the swordsman needs the OTHER filter. */
      .create-stage::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: var(--road-art);
        background-size: cover;
        background-position: 50% 100%;
        filter: url(#ink-poster);
        pointer-events: none;
      }
      /* Fades the band's foot into the page, so the painting ends the way ink
         ends — into the paper — instead of at a ruled line. */
      .create-stage::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 46%;
        background: linear-gradient(180deg, rgba(232, 220, 192, 0) 0%, var(--paper) 88%);
        pointer-events: none;
      }
      .create-scroll {
        background: var(--paper);
      }
      .create-stage,
      .create-scroll,
      .create-foot {
        position: relative;
        z-index: 1;
      }
      .create-stage {
        flex: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: calc(env(safe-area-inset-top, 0) + 26px) 20px 14px;
      }
      /* Bigger than it was, and standing ON the painted road rather than beside
         it. At 152px the figure was a thumbnail on a backdrop; at 210 it is the
         subject of the picture, which is what a character screen is for. */
      .create-portrait,
      .create-caption {
        position: relative;
        z-index: 1;
      }
      /* The wet edge, and the paper the figure is reserved out of.
         Reported as "o preview do character parece desfocar no fundo", which is
         two faults with one look: the brush filter was softening the outline at
         the same time as the posterised painting was rising to meet the
         figure's own value. They met in the middle and the figure stopped being
         in front of anything.
         The displacement drops to 1.1 — enough for a bristled edge, not enough
         to fray it — and a paper glow is laid behind. That glow is not a
         graphic trick borrowed from elsewhere: reserving a halo of bare paper
         around the subject is exactly what an ink painter does, and it is why a
         figure in a real 水墨 never dissolves into its own wash. */
      .create-stage .portrait-svg {
        filter: url(#ink-brush)
          drop-shadow(0 0 10px rgba(232, 220, 192, 0.85))
          drop-shadow(0 0 24px rgba(232, 220, 192, 0.5));
      }
      /* Bigger. At 186×214 inside a full-width painting the swordsman was a
         detail in somebody else's landscape, which is backwards on the screen
         where he is being made. */
      .create-stage .portrait-svg {
        width: 236px;
        height: 272px;
      }
      .create-caption {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        margin-top: 2px;
        text-align: center;
      }
      .create-cap-school {
        font-size: 13px;
        color: rgba(13, 13, 13, 0.62);
      }
      .create-cap-weapon {
        font-size: 12px;
        color: var(--cinnabar);
      }
      .create-scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 6px 20px 14px;
      }
      .create-foot {
        flex: none;
        display: flex;
        gap: 10px;
        padding: 10px 20px calc(env(safe-area-inset-bottom, 0) + 14px);
        border-top: 1px solid rgba(13, 13, 13, 0.1);
        background: var(--paper);
      }
      /* The swordsman's own scene is redundant once the painting is behind
         them: two roads, one drawn and one painted, at two different scales.
         The portrait keeps its figure and drops its backdrop. */
      .create-stage .portrait-svg > svg {
        display: none;
      }
      .create-note {
        margin: -2px 0 12px;
        font-size: 12.5px;
        line-height: 1.5;
        color: rgba(13, 13, 13, 0.55);
      }

      /* --- bearing: the three things equipment cannot overwrite --------- */
      .look-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
      }
      /* 76px and never wrapping. At 54 the longest label — "YOU ARE" — broke
         over two lines while every other row stayed on one, so the five rows
         no longer shared a baseline and the whole block read as misaligned.
         A label column is only a column while every label fits in it. */
      .look-label {
        flex: none;
        width: 76px;
        white-space: nowrap;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(13, 13, 13, 0.55);
      }
      .look-chips {
        display: flex;
        flex: 1;
        gap: 6px;
      }
      /* Deliberately NOT called .chip: that class already exists for the
         in-run technique chips on the HUD, and reusing it would have styled
         both from whichever rule happened to come last in this file. */
      .look-chip {
        flex: 1;
        padding: 9px 6px;
        font: inherit;
        font-size: 12.5px;
        color: var(--ink);
        background: rgba(255, 252, 244, 0.55);
        border: 1px solid rgba(13, 13, 13, 0.12);
        border-radius: 2px;
        cursor: pointer;
      }
      .look-chip-on {
        color: var(--paper);
        background: var(--ink);
        border-color: var(--ink);
      }
      /* A dye chip shows the dye. A row of identical grey chips labelled with
         colour NAMES would be the single most absurd control in a game whose
         complaint was that it looked monochrome. */
      .dye-chip {
        flex: 1;
        min-height: 40px;
        padding: 8px 4px;
        font: inherit;
        font-size: 15px;
        color: var(--paper);
        border: 1px solid rgba(13, 13, 13, 0.16);
        border-radius: 2px;
        cursor: pointer;
      }
      .dye-chip-on {
        outline: 2px solid var(--ink);
        outline-offset: 1px;
      }
      .dye-chip:active {
        transform: scale(0.97);
      }
      .look-chip:active {
        transform: scale(0.98);
      }
      .title[hidden],
      .create[hidden],
      .codex[hidden] {
        display: none;
      }
      .title.shown,
      .create.shown,
      .codex.shown {
        opacity: 1;
      }

      /* --- title ------------------------------------------------------ */
      .title {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 18px;
        text-align: center;
        /* The one screen that keeps the ink ground: it is a cover, not a
           document, and the seal has to carry it. */
        background: var(--ink);
        color: var(--paper);
      }
      .title-seal {
        font-size: 62px;
        letter-spacing: 0.12em;
        color: var(--cinnabar);
      }
      .title-roman {
        margin-top: 6px;
        font-size: 13px;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: rgba(232, 220, 192, 0.55);
      }
      .title-pitch {
        max-width: 300px;
        font-size: 14px;
        line-height: 1.6;
        color: rgba(232, 220, 192, 0.72);
      }
      .title-go {
        margin-top: 12px;
        padding: 15px 46px;
        font: inherit;
        font-size: 15px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--ink);
        background: var(--paper);
        border: 0;
        border-radius: 3px;
        cursor: pointer;
      }
      .title-go:active {
        transform: scale(0.97);
      }
      /* Quiet on purpose. It is destructive and it sits under Continue, so it
         must be findable without ever competing with the thing you came for. */
      .title-new {
        margin-top: 18px;
        padding: 10px 18px;
        font: inherit;
        font-size: 12px;
        letter-spacing: 0.08em;
        /* Paper on ink, NOT ink on paper. The title is the one screen that
           keeps the dark ground, so the hub's button colours would have drawn
           this in near-black on near-black — invisible, on the control whose
           entire problem was that it could not be found. */
        color: rgba(232, 220, 192, 0.5);
        background: none;
        border: 1px solid rgba(232, 220, 192, 0.22);
        border-radius: 3px;
        cursor: pointer;
      }
      .title-new:active {
        transform: scale(0.98);
      }
      /* CC BY 3.0 is only free if the credit ships. It sits at the foot of
         the one screen every player sees, small enough not to compete with the
         title and permanent enough to satisfy the licence. */
      .title-credit {
        position: absolute;
        bottom: 14px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 9.5px;
        letter-spacing: 0.04em;
        color: rgba(232, 220, 192, 0.35);
      }
      .title-who {
        font-size: 12px;
        letter-spacing: 0.1em;
        color: rgba(232, 220, 192, 0.42);
      }

      /* --- character creation ------------------------------------------ */
      .create-title {
        font-size: 24px;
        letter-spacing: 0.03em;
      }
      .create-sub {
        margin-top: 6px;
        font-size: 13.5px;
        line-height: 1.5;
        color: rgba(13, 13, 13, 0.58);
      }
      .create-section {
        margin: 26px 0 10px;
        font-size: 11.5px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(13, 13, 13, 0.45);
      }
      .create-name {
        display: flex;
        gap: 8px;
      }
      .create-input {
        flex: 1;
        min-width: 0;
        min-height: 46px;
        padding: 0 12px;
        font: inherit;
        font-size: 16px; /* 16px or iOS zooms the viewport on focus. */
        color: var(--ink);
        background: rgba(255, 252, 244, 0.7);
        border: 1px solid rgba(13, 13, 13, 0.18);
        border-radius: 2px;
      }
      .create-roll {
        flex: none;
        width: 52px;
        min-height: 46px;
        font-size: 19px;
        color: var(--paper);
        background: var(--ink);
        border: 0;
        border-radius: 2px;
        cursor: pointer;
      }
      .create-roll:active {
        transform: scale(0.95);
      }

      .origin {
        display: flex;
        gap: 12px;
        width: 100%;
        margin-bottom: 8px;
        padding: 13px 14px;
        text-align: left;
        font: inherit;
        background: rgba(255, 252, 244, 0.55);
        border: 1px solid rgba(13, 13, 13, 0.12);
        border-left: 3px solid rgba(13, 13, 13, 0.16);
        border-radius: 2px;
        cursor: pointer;
      }
      .origin-on {
        background: rgba(255, 250, 232, 0.92);
        border-left-color: var(--cinnabar);
      }
      /* The card leads with the swordsman this school produces, so the row is
         five different silhouettes rather than five paragraphs. This is the
         whole reason the figure builder was kept free of Pixi. */
      .origin-figure {
        flex: none;
        width: 54px;
        display: grid;
        place-content: center;
        background: rgba(13, 13, 13, 0.045);
        border-radius: 2px;
      }
      .origin-figure .portrait-svg {
        width: 52px;
        height: 66px;
      }
      .origin-on .origin-figure {
        background: rgba(193, 39, 45, 0.1);
      }
      .origin-text {
        flex: 1;
        min-width: 0;
      }
      .origin-name {
        font-size: 15px;
      }
      /* The weapon leads on a school card: it is the part of the choice the
         player feels within a second of setting out. */
      .origin-weapon {
        margin-top: 3px;
        font-size: 13px;
        color: var(--cinnabar);
      }
      .origin-effect {
        margin-top: 3px;
        font-size: 12px;
        line-height: 1.4;
        color: #8a6d16;
      }
      .origin-blurb {
        margin-top: 5px;
        font-size: 12px;
        line-height: 1.45;
        color: rgba(13, 13, 13, 0.5);
      }

      /* --- equipment ---------------------------------------------------- */
      .slot {
        margin-bottom: 12px;
      }
      .slot-name {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        letter-spacing: 0.1em;
        color: rgba(13, 13, 13, 0.4);
        margin-bottom: 5px;
      }
      .slot-icon {
        /* 15px at 0.45 was almost invisible beside the label — an icon nobody
           can see is worse than no icon, because it still costs the row. */
        width: 18px;
        height: 18px;
        flex: none;
        opacity: 0.6;
      }
      /* An empty slot is the most useful line on this screen: it is the only
         place that says what to go and look for. */
      .slot-empty {
        font-size: 11px;
        color: rgba(193, 39, 45, 0.6);
        padding: 7px 0 2px;
      }
      /* Horizontal and scrollable, so a slot with eight options costs one row
         of height instead of eight. */
      .slot-items {
        display: flex;
        gap: 7px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 3px;
      }
      .item {
        /* Grows to fill the row when a slot holds one find, overflows into the
           horizontal scroll when it holds six. `flex: none` did the second half
           and left a single item sitting in a half-empty row looking like a
           layout that had failed. */
        flex: 1 0 158px;
        min-height: 58px;
        position: relative;
        /* Left padding makes room for the item's own icon, which is absolutely
           positioned into it. */
        padding: 9px 11px 9px 40px;
        text-align: left;
        font: inherit;
        color: var(--ink);
        /* THE RUNG, IN THREE CHANNELS. Hue alone made the ladder read as six
           shades rather than six steps, and grey on aged paper is barely a
           line. Every one of these comes from data/rarity.ts through
           rarityStyle(), so the ladder is defined once. */
        background:
          linear-gradient(
            90deg,
            rgba(var(--rung-rgb, 13, 13, 13), calc(var(--rung-wash, 0) * 1.6)),
            rgba(var(--rung-rgb, 13, 13, 13), calc(var(--rung-wash, 0) * 0.35)) 60%,
            rgba(var(--rung-rgb, 13, 13, 13), 0)
          ),
          rgba(255, 252, 244, 0.5);
        border: 1px solid rgba(13, 13, 13, 0.12);
        border-left: var(--rung-edge, 3px) solid var(--rung, rgba(13, 13, 13, 0.14));
        border-radius: 2px;
        /* Only the top three rungs glow — see the `card` ladder's comment. At
           0 the shadow is transparent and costs nothing. */
        box-shadow: 0 0 0 1px rgba(var(--rung-rgb, 13, 13, 13), var(--rung-glow, 0)),
          0 2px 10px -2px rgba(var(--rung-rgb, 13, 13, 13), var(--rung-glow, 0));
        cursor: pointer;
      }
      /* The item's own shape, so a card is findable without reading it. It sits
         in the padding at the left rather than above the name: a 158px card has
         no vertical room to give away, and the name must stay the loudest thing
         on it. */
      .item-icon {
        position: absolute;
        left: 9px;
        top: 50%;
        width: 22px;
        height: 22px;
        transform: translateY(-50%);
      }
      .item-worn .item-icon {
        color: var(--paper);
      }
      /* The rung's colour is set inline, and the worn card is near-black — so a
         grey 凡 name landed almost invisible against it. Lifting it keeps the
         hue (the ladder still reads) while making the name legible on the dark
         card, which is the one card a player looks at most. */
      .item-worn .item-name {
        filter: brightness(2.1) saturate(0.85);
      }
      .item-seal {
        font-size: 0.85em;
        opacity: 0.85;
      }
      /* The named power, on 神 and 仙 pieces only. */
      .item-power {
        margin-top: 3px;
        font-size: 10.5px;
        letter-spacing: 0.04em;
        color: var(--gold);
      }
      .item-r1 {
        border-left-color: var(--gold);
      }
      .item-r2 {
        border-left-color: var(--cinnabar);
      }
      .item-worn {
        /* The wash again, over ink instead of paper. Without this the worn
           card — the one card a player looks at most — was the only place the
           ladder stopped speaking, because a flat fill overrode it. */
        background:
          linear-gradient(
            90deg,
            rgba(var(--rung-rgb, 232, 220, 192), calc(var(--rung-wash, 0) * 2.2)),
            rgba(var(--rung-rgb, 232, 220, 192), 0) 70%
          ),
          rgba(13, 13, 13, 0.9);
        color: var(--paper);
      }
      .item:not(.item-worn):active {
        transform: scale(0.97);
      }
      .item-name {
        font-size: 13px;
        font-weight: var(--rung-weight, 500);
        color: var(--rung, var(--ink));
        /* Two of the six rungs are near the paper's own value (grey) or near
           the ink's (deep green). Nudging them here keeps ONE definition of
           each colour while letting the name stay legible on both card
           backgrounds — the pale one and the near-black worn one. */
        filter: saturate(0.92) brightness(0.9);
      }
      .item-line {
        margin-top: 3px;
        font-size: 11px;
        line-height: 1.35;
        color: rgba(13, 13, 13, 0.55);
      }
      .item-worn .item-line {
        color: rgba(232, 220, 192, 0.62);
      }

      /* Loot on the reward screen. */
      .rw-found {
        margin-top: 14px;
      }
      /* A find, as a CARD. The reward screen was reported as "a shopping list,
         only text" — seven identical rows where nothing led the eye. A find is
         the part worth scrolling for, so it gets the icon the pack and the
         ground mark already use, and a left edge in its own rung's colour.
         --rung is set inline from data/rarity.ts, so the ladder is defined in
         exactly one place. */
      .loot-grid {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .loot {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border: 1px solid rgba(13, 13, 13, 0.1);
        border-left: var(--rung-edge, 3px) solid var(--rung, rgba(13, 13, 13, 0.2));
        border-radius: 4px;
        /* Same three-channel ladder as the pack's cards — see `.item`. A find
           and the same find in the bag must not read as two different objects. */
        background:
          linear-gradient(
            90deg,
            rgba(var(--rung-rgb, 13, 13, 13), calc(var(--rung-wash, 0) * 1.6)),
            rgba(var(--rung-rgb, 13, 13, 13), calc(var(--rung-wash, 0) * 0.35)) 60%,
            rgba(var(--rung-rgb, 13, 13, 13), 0)
          ),
          rgba(255, 255, 255, 0.42);
        box-shadow: 0 0 0 1px rgba(var(--rung-rgb, 13, 13, 13), var(--rung-glow, 0)),
          0 2px 12px -3px rgba(var(--rung-rgb, 13, 13, 13), var(--rung-glow, 0));
      }
      .loot-icon {
        flex: none;
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
      }
      .loot-svg {
        width: 24px;
        height: 24px;
        display: block;
      }
      .loot-body {
        flex: 1;
        min-width: 0;
      }
      .loot-name {
        display: block;
        font-size: 13px;
        font-weight: var(--rung-weight, 600);
        color: var(--rung, var(--ink));
        /* The grey rung is nearly the paper's own value; on a pale card its
           name would vanish. Lifting it here rather than changing the ladder
           keeps one definition of the colour. */
        filter: saturate(0.9) brightness(0.92);
      }
      .loot-lines {
        display: flex;
        flex-wrap: wrap;
        gap: 3px 8px;
        margin-top: 2px;
      }
      .loot-line {
        font-size: 10.5px;
        color: rgba(13, 13, 13, 0.55);
        font-variant-numeric: tabular-nums;
      }
      /* A named power is the thing worth telling somebody about, so it never
         sits in the same grey as the rolled lines. */
      .loot-power {
        font-size: 10.5px;
        letter-spacing: 0.04em;
        color: var(--gold);
      }
      .rw-note {
        margin-top: 8px;
        font-size: 11.5px;
        color: rgba(13, 13, 13, 0.4);
      }
      /* What a death cost — the "semi hardcore" stake. Its own heading and its
         own colour, because this is the one section of the reward screen that
         only a death ever produces, and it needs to read as a LOSS rather
         than blend into the finds above it. */
      .rw-lost {
        margin-top: 14px;
        color: var(--cinnabar);
      }
      .loot-lost {
        opacity: 0.55;
        background: none;
      }
      .loot-lost .loot-name {
        text-decoration: line-through;
        text-decoration-color: rgba(193, 39, 45, 0.55);
      }
      /* Rank, as pips rather than a number. An item card is 158px wide and
         already carries a name and a line of effect; "rank 3" would need a word
         of explanation that three dots does not. */
      .item-rank,
      .loot-rank {
        margin-left: 5px;
        color: #8a6d16;
        font-style: normal;
        letter-spacing: 2px;
      }
      /* --- the art strip ---------------------------------------------------
         Asked for as a hotbar; built as a READOUT, because the thumb stays on
         movement. Each tile carries an art and the CONDITION that wakes it, and
         lights when that condition holds. Without this the arts are invisible
         rules — a conditional system is only learnable if the player can see
         which condition is true at the moment it becomes true.

         Top-left, under the bars: a thumb lives at the bottom of a phone, so
         anything it must READ belongs where a hand is not. */
      /* Centred, above the thumb — the one element a player must glance at
         constantly, placed where the eye already is because that is where the
         swordsman is. */
      .hud-arts {
        display: flex;
        justify-content: center;
        gap: 7px;
        margin-top: 12px;
        pointer-events: none;
      }
      /* Sized so the whole scroll of FIVE fits a 393px phone with its gaps —
         5x54 + 4x7 = 298. The strip used to hold only the arts you carried, so
         it never had to; it now holds the empty slots too. */
      .art {
        width: 54px;
        height: 54px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        border: 1px solid rgba(13, 13, 13, 0.14);
        border-radius: 6px;
        background: rgba(13, 13, 13, 0.04);
        transition:
          border-color 90ms ease-out,
          background 90ms ease-out;
      }
      /* The icon carries the EFFECT — see src/render/packIcons.ts. Four seals
         of similar stroke count were four identical grey squares at this size,
         glanced at with a thumb busy. */
      .art-icon {
        width: 28px;
        height: 28px;
        display: block;
        opacity: 0.36;
        transition: opacity 90ms ease-out;
      }
      /* A PICTOGRAM of the condition, not its seal — see PACK_CONDITION_ICON
         in render/packIcons.ts. A seal alone asked a player who reads no
         Chinese to learn that 静 means "stop moving" by dying a few times;
         the strip is the one place a mechanic must never rest on a character
         alone. The seal itself keeps its place in the hub, where there is
         time to read a name. */
      .art-cond-icon {
        width: 15px;
        height: 15px;
        display: block;
        opacity: 0.32;
        transition: opacity 90ms ease-out;
      }
      /* Grade, as pips rather than a number — the same rule as an item's rank.
         Off (all dim) until the grade actually moves, so an art nobody has
         raised yet reads as exactly that. */
      .art-pips {
        display: flex;
        gap: 2px;
        margin-top: 1px;
      }
      .art-pip {
        width: 5px;
        height: 3px;
        border-radius: 1.5px;
        background: rgba(138, 109, 22, 0.18);
      }
      .art-pip-on {
        background: var(--gold);
      }
      /* An art the blade in hand has not woken. An empty socket, not a dim
         copy of a real tile: dashed rather than solid, no effect icon, no
         pips. A player carrying a common blade must be able to see at a glance
         that four more slots exist and that something fills them — otherwise
         the strip reads as "this is all there is". */
      .art-asleep {
        border-style: dashed;
        border-color: rgba(13, 13, 13, 0.2);
        background: none;
      }
      .art-asleep .art-cond-icon {
        width: 20px;
        height: 20px;
        opacity: 0.17;
      }
      /* Lit. Cinnabar, because in this game cinnabar means "now". */
      .art-on {
        border-color: var(--cinnabar);
        background: rgba(193, 39, 45, 0.09);
      }
      .art-on .art-icon,
      .art-on .art-cond-icon {
        opacity: 1;
      }
      .art-on .art-cond-icon {
        color: var(--cinnabar);
      }

      /* --- the rift's bar ------------------------------------------------
         A hairline across the very top edge — the one element that survives
         everything else this layout deletes from up there. Read peripherally,
         "how much is left", never looked at directly; see docs/CORRIDAS.md for
         why it fills by killing rather than by a clock. */
      .hud-rift {
        position: absolute;
        top: env(safe-area-inset-top, 0);
        left: 0;
        right: 0;
        height: 3px;
        background: rgba(13, 13, 13, 0.08);
      }
      .hud-rift[hidden] {
        display: none;
      }
      .hud-rift-fill {
        height: 100%;
        background: var(--cinnabar);
        transform-origin: left center;
        transition: transform 260ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      /* --- 法 the arts ----------------------------------------------------
         A ranked list. Every art on the scroll has a place; the blade in hand
         decides how far down the list the arts actually wake, so the awake ones
         are always the rows at the top and the next one to wake is the row
         directly below them. That is the only thing a thumb has to learn here,
         and it is the whole reason ranking is a decision. */
      .arts-head {
        margin-top: 2px;
      }
      .arts-count {
        color: #8a6d16;
        font-weight: 600;
      }
      .arts-note {
        font-size: 10.5px;
        line-height: 1.45;
        color: rgba(13, 13, 13, 0.42);
        margin: 2px 0 10px;
      }
      .art-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 16px;
      }
      .art-row {
        position: relative;
        display: flex;
        align-items: center;
        gap: 9px;
        width: 100%;
        padding: 9px 10px;
        border: 1px solid rgba(13, 13, 13, 0.12);
        border-radius: 5px;
        background: rgba(13, 13, 13, 0.015);
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      /* Awake: cinnabar, the colour this game uses for "now" everywhere. */
      .art-row-on {
        border-color: rgba(193, 39, 45, 0.5);
        background: rgba(193, 39, 45, 0.05);
      }
      /* Asleep — ranked, but past what the blade in hand reaches. Shown rather
         than hidden, so the reward for a better weapon is visible BEFORE it
         arrives. A reward nobody can see coming is not a reward. */
      .art-row-off {
        border-style: dashed;
        opacity: 0.5;
      }
      .art-row-place {
        flex: none;
        width: 13px;
        font-size: 12px;
        font-weight: 600;
        color: rgba(13, 13, 13, 0.3);
        text-align: center;
      }
      .art-row-icon {
        flex: none;
        width: 26px;
        height: 26px;
        opacity: 0.3;
      }
      .art-row-on .art-row-icon {
        opacity: 0.95;
      }
      .art-row-text {
        flex: 1;
        min-width: 0;
      }
      .art-row-name {
        display: block;
        font-size: 12.5px;
        font-weight: 600;
        color: rgba(13, 13, 13, 0.9);
      }
      .art-row-blurb {
        display: block;
        font-size: 9.5px;
        line-height: 1.35;
        color: rgba(13, 13, 13, 0.45);
        margin-top: 1px;
      }
      /* Only on the row directly below the awake ones: what a better blade
         buys, said once. The carrot has to be visible BEFORE the blade is. */
      .art-row-wake {
        display: block;
        font-size: 8.5px;
        line-height: 1.3;
        color: var(--gold);
        margin-top: 3px;
      }
      .art-row-cond {
        flex: none;
        width: 52px;
        text-align: center;
      }
      .art-row-seal {
        display: block;
        font-family: serif;
        font-size: 17px;
        line-height: 1;
        color: rgba(13, 13, 13, 0.35);
      }
      .art-row-on .art-row-seal {
        color: var(--cinnabar);
      }
      .art-row-how {
        display: block;
        font-size: 8.5px;
        color: rgba(13, 13, 13, 0.4);
        margin-top: 2px;
      }
      /* The five conditions, spelled out. The strip in play shows WHICH is
         true; this is the only place that says what they mean. */
      .cond-row {
        display: flex;
        align-items: baseline;
        gap: 9px;
        padding: 6px 0;
        border-top: 1px solid rgba(13, 13, 13, 0.07);
      }
      .cond-seal {
        flex: none;
        width: 20px;
        font-family: serif;
        font-size: 15px;
        color: var(--cinnabar);
        opacity: 0.8;
      }
      .cond-name {
        flex: none;
        width: 74px;
        font-size: 11px;
        font-weight: 600;
        color: rgba(13, 13, 13, 0.8);
      }
      .cond-how {
        flex: 1;
        font-size: 10px;
        line-height: 1.35;
        color: rgba(13, 13, 13, 0.45);
      }

      /* --- roster ---------------------------------------------------------
         A strip of swordsmen with the one being played picked out. Replaced a
         single button that destroyed the character you were playing. */
      .roster-row {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 4px 0 2px;
        -webkit-overflow-scrolling: touch;
      }
      .roster-card {
        flex: 0 0 92px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 8px 6px 10px;
        font: inherit;
        color: var(--ink);
        background: rgba(13, 13, 13, 0.03);
        border: 1px solid rgba(13, 13, 13, 0.12);
        border-radius: 4px;
        cursor: pointer;
      }
      .roster-on {
        background: rgba(193, 39, 45, 0.06);
        border-color: var(--cinnabar);
      }
      .roster-figure {
        height: 62px;
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      .roster-figure svg {
        height: 100%;
      }
      .roster-name {
        font-size: 12px;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .roster-sub {
        font-size: 10px;
        opacity: 0.45;
        white-space: nowrap;
      }
      .roster-add {
        justify-content: center;
        border-style: dashed;
      }
      .roster-plus {
        height: 62px;
        display: flex;
        align-items: center;
        font-size: 26px;
        opacity: 0.35;
      }
      .roster-full {
        padding: 6px 2px 0;
        font-size: 11px;
        opacity: 0.45;
      }
      /* Plain text, and last. Giving up a swordsman is a rare deliberate act
         now that it is no longer the only route to character creation, so it
         must not look like the thing to tap. */
      .roster-give {
        margin-top: 10px;
        padding: 6px 2px;
        font: inherit;
        font-size: 12px;
        color: var(--ink);
        opacity: 0.4;
        background: none;
        border: 0;
        text-align: left;
        cursor: pointer;
      }
      .create-back {
        flex: none;
        padding: 16px 20px;
        font: inherit;
        font-size: 13px;
        color: rgba(13, 13, 13, 0.55);
        background: none;
        border: 1px solid rgba(13, 13, 13, 0.16);
        border-radius: 3px;
        cursor: pointer;
      }
      /* 印 — the seal that finishes the painting.
         A Chinese painting is done when its author presses their seal into it,
         and this screen IS a painting being made: the swordsman is brushed on
         stroke by stroke above. A black rectangle reading TAKE UP THE SWORD at
         the end of that throws the whole conceit away in its last inch. */
      .create-go {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 16px 12px 12px;
        font: inherit;
        text-align: left;
        color: var(--ink);
        background: rgba(255, 252, 244, 0.7);
        border: 1px solid rgba(13, 13, 13, 0.16);
        border-radius: 3px;
        cursor: pointer;
        transition:
          transform 90ms ease,
          background 160ms ease;
      }
      /* Pressed INTO the paper rather than lifted off it — a seal is stamped
         downward, so the whole control sinks and the mark darkens. */
      .create-go:active {
        transform: translateY(1px) scale(0.995);
        background: rgba(255, 252, 244, 0.95);
      }
      .seal-mark {
        flex: none;
        width: 54px;
        height: 54px;
        display: grid;
        grid-template-rows: 1fr 1fr;
        place-items: center;
        background: var(--cinnabar);
        color: var(--paper);
        /* Seal script is carved, so the corners are square and the edge is
           slightly irregular. 3px of radius is the most it can take before it
           starts reading as a rounded app icon. */
        border-radius: 3px;
        line-height: 0.95;
        font-size: 21px;
        font-weight: 600;
        box-shadow: inset 0 0 0 2px rgba(232, 220, 192, 0.32);
        transition: box-shadow 160ms ease;
      }
      .create-go:active .seal-mark {
        box-shadow:
          inset 0 0 0 2px rgba(232, 220, 192, 0.32),
          0 0 0 3px rgba(193, 39, 45, 0.22);
      }
      .seal-glyph {
        display: block;
      }
      .seal-text {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
      }
      .seal-title {
        font-size: 16px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .seal-hint {
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(13, 13, 13, 0.45);
      }

      /* --- codex -------------------------------------------------------- */
      .codex-title {
        font-size: 21px;
        margin-bottom: 18px;
      }
      .codex-entry {
        display: flex;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid rgba(13, 13, 13, 0.08);
      }
      .codex-seal {
        flex: none;
        width: 26px;
        font-size: 17px;
        color: var(--cinnabar);
        text-align: center;
      }
      .codex-head {
        font-size: 14px;
        line-height: 1.35;
      }
      .codex-text {
        margin-top: 4px;
        font-size: 13px;
        line-height: 1.5;
        color: rgba(13, 13, 13, 0.58);
      }
      .codex-go {
        display: block;
        width: 100%;
        margin-top: 20px;
        padding: 15px;
        font: inherit;
        font-size: 15px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--paper);
        background: var(--ink);
        border: 0;
        border-radius: 3px;
        cursor: pointer;
      }

      /* --- hub -------------------------------------------------------- */
      /* A column with three fixed bands and one scrolling one, not a single
         long scroll. Identity is always on screen, "Set out" is always within
         thumb reach, and only the pane between them moves. The old layout put
         everything in one scroll and buried the button that leaves. */
      .hub {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        pointer-events: auto;
        opacity: 0;
        transition: opacity 300ms ease;
      }
      .hub-body {
        flex: 1;
        /* Without this a flex child refuses to shrink below its content and the
           pane pushes the tab bar off the bottom of the phone. */
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 14px 18px 18px;
      }
      .pane {
        display: block;
      }

      /* The swordsman, drawn from the same geometry the game renders in play. */
      .stage {
        display: flex;
        justify-content: center;
        padding: 0 0 6px;
      }
      /* The geometry is tuned to read at roughly this size in play. Blown up
         much larger the robe stops being a silhouette and becomes a blob, so
         the portrait is deliberately modest rather than filling the pane. */
      .stage .portrait-svg {
        width: 150px;
        height: 166px;
      }
      .stage-small .portrait-svg {
        width: 120px;
        height: 140px;
      }
      .portrait-svg {
        display: block;
        overflow: visible;
      }

      /* --- pinned action ------------------------------------------------ */
      .hub-action {
        flex: none;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 18px;
        border-top: 1px solid rgba(13, 13, 13, 0.1);
      }
      .hub-dest {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .hub-dest-seal {
        font-size: 12px;
        color: var(--cinnabar);
      }
      .hub-dest-name {
        font-size: 13px;
        color: rgba(13, 13, 13, 0.62);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* --- tabs --------------------------------------------------------- */
      .hub-tabs {
        flex: none;
        display: flex;
        border-top: 1px solid rgba(13, 13, 13, 0.12);
        padding-bottom: env(safe-area-inset-bottom, 0);
        background: rgba(13, 13, 13, 0.035);
      }
      .tab {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 9px 4px 10px;
        font: inherit;
        background: none;
        border: 0;
        border-top: 2px solid transparent;
        color: rgba(13, 13, 13, 0.4);
        cursor: pointer;
      }
      .tab-on {
        color: var(--ink);
        border-top-color: var(--cinnabar);
        background: var(--paper);
      }
      .tab-seal {
        font-size: 17px;
        line-height: 1.1;
        position: relative;
      }
      /* Points waiting to be spent, on the tab that spends them. Cinnabar on
         the one screen that is otherwise all ink, because this is the only
         badge in the hub and it is meant to be the thing the eye snags on. */
      .tab-owed {
        position: absolute;
        top: -5px;
        right: -12px;
        min-width: 15px;
        padding: 0 3px;
        border-radius: 8px;
        background: var(--cinnabar);
        color: var(--paper);
        font-size: 10px;
        font-weight: 700;
        line-height: 15px;
        text-align: center;
      }
      /* The grade this art fires at, given everything worn. Gold, because it
         is the number the gear bought — the one thing on this pane that a
         better robe changes. Blank on a sleeping art rather than zero: nothing
         is the honest reading of "this does not fire yet". */
      .art-row-grade {
        flex: none;
        width: 15px;
        font-size: 13px;
        font-weight: 700;
        text-align: center;
        color: var(--gold);
      }
      .tab-name {
        font-size: 9.5px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      /* --- starting over ------------------------------------------------ */
      .hub-again {
        display: block;
        width: 100%;
        margin-top: 18px;
        padding: 12px;
        font: inherit;
        font-size: 12px;
        letter-spacing: 0.08em;
        color: rgba(13, 13, 13, 0.45);
        background: none;
        border: 1px solid rgba(13, 13, 13, 0.14);
        border-radius: 3px;
        cursor: pointer;
      }
      /* The destructive path asks first, and defaults to keeping: the safe
         button comes first and a tap on the darkened area dismisses. */
      .confirm {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        padding: 24px;
        background: rgba(13, 13, 13, 0.55);
        pointer-events: auto;
        z-index: 40;
      }
      .confirm-box {
        width: min(320px, 84vw);
        padding: 20px;
        background: var(--paper);
        color: var(--ink);
        border-radius: 4px;
      }
      .confirm-title {
        font-size: 17px;
      }
      .confirm-body {
        margin-top: 8px;
        font-size: 13px;
        line-height: 1.5;
        color: rgba(13, 13, 13, 0.6);
      }
      .confirm-row {
        display: flex;
        gap: 10px;
        margin-top: 18px;
      }
      .confirm-keep,
      .confirm-go {
        flex: 1;
        padding: 13px;
        font: inherit;
        font-size: 13px;
        border-radius: 3px;
        cursor: pointer;
      }
      .confirm-keep {
        color: var(--ink);
        background: none;
        border: 1px solid rgba(13, 13, 13, 0.2);
      }
      .confirm-go {
        color: var(--paper);
        background: var(--cinnabar);
        border: 0;
      }
      /* A class selector beats the UA's [hidden] { display: none }. Getting
         this wrong once shipped a full-screen invisible panel that swallowed
         every touch while the game ran perfectly underneath it. */
      .hub[hidden] {
        display: none;
      }
      .hub.shown {
        opacity: 1;
      }

      .hub-head {
        flex: none;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: calc(env(safe-area-inset-top, 0) + 14px) 18px 12px;
        border-bottom: 1px solid rgba(13, 13, 13, 0.1);
      }
      .hub-seal {
        flex: none;
        width: 62px;
        height: 62px;
        display: grid;
        place-content: center;
        font-size: 21px;
        line-height: 1.15;
        text-align: center;
        color: var(--paper);
        background: var(--cinnabar);
        border-radius: 3px;
        letter-spacing: 0;
      }
      .hub-ident {
        flex: 1;
        min-width: 0;
      }
      /* The name leads. A panel that opens on a rank describes a rank; one
         that opens on a name describes somebody the numbers belong to. */
      .hub-name {
        font-size: 20px;
        letter-spacing: 0.02em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .hub-origin {
        margin-top: 2px;
        font-size: 12px;
        color: var(--cinnabar);
        letter-spacing: 0.03em;
      }
      .hub-realm {
        margin-top: 4px;
        font-size: 13px;
        color: rgba(13, 13, 13, 0.55);
      }
      .hub-level {
        margin-left: 6px;
        color: var(--gold);
        font-variant-numeric: tabular-nums;
      }
      .hub-step {
        margin-left: 5px;
        color: rgba(13, 13, 13, 0.35);
        font-variant-numeric: tabular-nums;
      }
      .hub-codex {
        flex: none;
        width: 34px;
        height: 34px;
        align-self: flex-start;
        font: inherit;
        font-size: 15px;
        color: rgba(13, 13, 13, 0.45);
        background: rgba(13, 13, 13, 0.06);
        border: 0;
        border-radius: 50%;
        cursor: pointer;
      }
      .hub-codex:active {
        transform: scale(0.94);
      }

      .hub-cult {
        margin-top: 16px;
      }
      .hub-cult-row {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(13, 13, 13, 0.45);
      }
      .hub-cult-row b {
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
        text-transform: none;
      }
      .hub-ident .hub-cult-track {
        margin-top: 7px;
      }
      .hub-cult-track {
        margin-top: 5px;
        height: 5px;
        background: rgba(13, 13, 13, 0.1);
        border-radius: 3px;
        overflow: hidden;
      }
      .hub-cult-fill {
        height: 100%;
        background: var(--gold);
        transform-origin: left center;
        transition: transform 320ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .block,
      .hub-section {
        margin-top: 22px;
      }
      .block-head,
      .hub-section-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 11px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(13, 13, 13, 0.45);
        margin-bottom: 8px;
      }
      .hub-points {
        letter-spacing: 0.04em;
        text-transform: none;
        font-size: 12px;
        color: var(--gold);
      }

      .attr {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 9px 0;
        border-bottom: 1px solid rgba(13, 13, 13, 0.08);
      }
      .attr-seal {
        flex: none;
        width: 32px;
        height: 32px;
        display: grid;
        place-content: center;
        font-size: 17px;
        color: rgba(13, 13, 13, 0.66);
        background: rgba(13, 13, 13, 0.06);
        border-radius: 2px;
      }
      .attr-text {
        flex: 1;
        min-width: 0;
      }
      .attr-name {
        font-size: 14px;
      }
      .attr-rank {
        margin-left: 4px;
        font-size: 12px;
        color: var(--gold);
        font-variant-numeric: tabular-nums;
      }
      /* What equipment is adding, kept separate from what was bought — so a
         player can see what a swap would cost them. */
      .attr-gear {
        margin-left: 3px;
        font-size: 12px;
        color: var(--cinnabar);
        font-variant-numeric: tabular-nums;
      }
      /* On the same line as the name now, not stacked under it. Four attributes
         each taking two lines was half the reason this screen read as a wall. */
      .attr-now {
        margin-left: 7px;
        font-size: 12px;
        color: rgba(13, 13, 13, 0.5);
        font-variant-numeric: tabular-nums;
      }
      /* Thumb-sized, and carrying its own consequence: the number it would
         produce is printed on the button you are about to press. */
      .attr-add {
        flex: none;
        min-width: 62px;
        min-height: 44px;
        display: grid;
        place-content: center;
        gap: 1px;
        font: inherit;
        color: var(--paper);
        background: var(--ink);
        border: 0;
        border-radius: 3px;
        cursor: pointer;
      }
      .attr-add:disabled {
        color: rgba(13, 13, 13, 0.22);
        background: rgba(13, 13, 13, 0.06);
        cursor: default;
      }
      .attr-add:not(:disabled):active {
        transform: scale(0.96);
      }
      .attr-plus {
        font-size: 15px;
        line-height: 1;
      }
      .attr-next {
        font-size: 10px;
        opacity: 0.72;
        font-variant-numeric: tabular-nums;
      }

      /* --- the map ------------------------------------------------------ */
      /* Five places rather than eight numbered squares. Each card carries the
         rule that makes the place itself and what can only be found there,
         because those two facts are the entire reason to choose one. */
      .map {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .place {
        display: flex;
        gap: 12px;
        width: 100%;
        padding: 13px 14px;
        text-align: left;
        font: inherit;
        color: var(--ink);
        background: rgba(255, 252, 244, 0.55);
        border: 1px solid rgba(13, 13, 13, 0.12);
        border-left: 3px solid rgba(13, 13, 13, 0.16);
        border-radius: 2px;
        cursor: pointer;
      }
      .place-on {
        background: rgba(255, 250, 232, 0.95);
        border-left-color: var(--cinnabar);
      }
      /* Dimmed, not erased. A locked place still lists what it keeps, because
         that list is the reason to want the realm that opens it — greying it
         past legibility would turn the bottom of the map into dead weight. */
      .place-locked {
        opacity: 0.55;
        cursor: default;
      }
      .place-seal {
        flex: none;
        width: 42px;
        height: 42px;
        display: grid;
        place-content: center;
        font-size: 13px;
        line-height: 1.15;
        text-align: center;
        color: rgba(13, 13, 13, 0.6);
        background: rgba(13, 13, 13, 0.06);
        border-radius: 2px;
      }
      .place-on .place-seal {
        color: var(--paper);
        background: var(--cinnabar);
      }
      .place-body {
        flex: 1;
        min-width: 0;
      }
      .place-name {
        font-size: 15px;
      }
      /* The rule is the loudest thing on the card after the name: it is what
         the player is actually choosing between. */
      .place-rule {
        margin-top: 3px;
        font-size: 12.5px;
        line-height: 1.4;
        color: rgba(13, 13, 13, 0.62);
      }
      .place-found {
        margin-top: 6px;
        font-size: 11px;
        line-height: 1.35;
        color: #8a6d16;
      }
      .place-reward {
        margin-top: 4px;
        font-size: 10.5px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: rgba(13, 13, 13, 0.4);
      }
      .place-locked-note {
        margin-top: 6px;
        font-size: 11px;
        letter-spacing: 0.06em;
        color: rgba(13, 13, 13, 0.45);
      }

      .hub-go {
        flex: none;
        padding: 15px 26px;
        font: inherit;
        font-size: 16px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--paper);
        background: var(--ink);
        border: 0;
        border-radius: 3px;
        cursor: pointer;
      }
      .hub-go:active {
        transform: scale(0.985);
      }
      .hub-totals {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 8px 16px;
        margin-top: 16px;
        font-size: 11px;
        color: rgba(13, 13, 13, 0.4);
      }
      .hub-totals b {
        color: rgba(13, 13, 13, 0.62);
        font-variant-numeric: tabular-nums;
      }

      #hint {
        position: fixed;
        left: 0;
        right: 0;
        bottom: calc(env(safe-area-inset-bottom, 0) + 46px);
        text-align: center;
        pointer-events: none;
        font-size: 13px;
        letter-spacing: 0.06em;
        color: var(--ink);
        opacity: 0;
        transition: opacity 700ms ease;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 8px;
        text-align: center;
        background: var(--ink);
        transition: opacity 400ms ease;
      }
      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }
      #boot .seal {
        font-size: 44px;
        color: var(--cinnabar);
        letter-spacing: 0.1em;
      }
      #boot .sub {
        font-size: 12px;
        color: rgba(232, 220, 192, 0.5);
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="hud"></div>
    <div id="ui"></div>
    <div id="hint"></div>
    <!-- 墨 — the two filters that make one picture out of two languages.
         Reported, and correctly: a hard-edged vector cut-out laid on a soft
         painted wash reads as pasted, because the two disagree about EDGES and
         about TONE, not about subject. Rendering all five combinations side by
         side settled it — the pair below is the one where they meet.

         POSTER steps the painting down to flat tones and strips its texture,
         which is the half the vector figure does not have. BRUSH pushes the
         figure's outline around with fractal noise, which is the half the
         painting does not have. Either alone narrows the gap; together they
         close it. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <filter id="ink-poster" color-interpolation-filters="sRGB">
          <feColorMatrix type="saturate" values="0" />
          <feComponentTransfer>
            <feFuncR type="discrete" tableValues="0.06 0.34 0.62 0.86 0.93" />
            <feFuncG type="discrete" tableValues="0.06 0.32 0.58 0.82 0.89" />
            <feFuncB type="discrete" tableValues="0.05 0.26 0.48 0.70 0.76" />
          </feComponentTransfer>
        </filter>
        <!-- The box is grown 12% each way: displacement pushes pixels OUTSIDE
             the source bounds, and a filter region left at its default clips
             exactly the ragged edge the filter exists to make. -->
        <filter id="ink-brush" x="-12%" y="-12%" width="124%" height="124%">
          <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="3" result="n" />
          <feDisplacementMap in="SourceGraphic" in2="n" scale="1.1"
            xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
    <div id="boot">
      <div class="seal">剑影</div>
      <div class="sub">Jiànyǐng</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
