<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 890" width="390" height="890"><rect width="390" height="890" fill="#ded3b8"/><text x="16" y="22" text-anchor="start" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0d0d0d" fill-opacity="0.85">A barra, nos 3 estados</text><text x="374" y="22" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" font-weight="normal" fill="#c1272d" fill-opacity="0.9">PROPOSTA</text><g transform="translate(0,46)"><rect width="390" height="844" fill="#e8dcc0"/><text x="16" y="40" text-anchor="start" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0d0d0d" fill-opacity="0.85">A BARRA DAS ARTES</text><text x="16" y="58" text-anchor="start" font-family="system-ui, sans-serif" font-size="9.5" font-weight="normal" fill="#0d0d0d" fill-opacity="0.45">Um mostrador, não botões. O polegar fica no movimento.</text><text x="16" y="92" text-anchor="start" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#c1272d" fill-opacity="0.95">Adormecida</text><text x="16" y="108" text-anchor="start" font-family="system-ui, sans-serif" font-size="9.5" font-weight="normal" fill="#0d0d0d" fill-opacity="0.45">A condição não se cumpre. O selo está apagado.</text><rect x="16" y="120" width="62" height="62" rx="5" fill="#0d0d0d" fill-opacity="0.04" stroke="#0d0d0d" stroke-opacity="0.14"/><text x="47" y="152" text-anchor="middle" font-family="serif" font-size="24" fill="#0d0d0d" fill-opacity="0.32">点</text><text x="47" y="172" text-anchor="middle" font-family="serif" font-size="13" fill="#0d0d0d" fill-opacity="0.3">静</text><circle cx="28" cy="190" r="2.1" fill="#8a6d16" fill-opacity="0.85"/><circle cx="38" cy="190" r="2.1" fill="#8a6d16" fill-opacity="0.85"/><circle cx="48" cy="190" r="2.1" fill="#8a6d16" fill-opacity="0.85"/><circle cx="58" cy="190" r="2.1" fill="#8a6d16" fill-opacity="0.15"/><circle cx="68" cy="190" r="2.1" fill="#8a6d16" fill-opacity="0.15"/><rect x="86" y="120" width="62" height="62" rx="5" fill="#0d0d0d" fill-opacity="0.04" stroke="#0d0d0d" stroke-opacity="0.14"/><text x="117" y="152" text-anchor="middle" font-family="serif" font-size="24" fill="#0d0d0d" fill-opacity="0.32">流</text><text x="117" y="172" text-anchor="middle" font-family="serif" font-size="13" fill="#0d0d0d" fill-opacity="0.3">疾</text><circle cx="98" cy="190" r="2.1" fill="#8a6d16" fill-opacity="0.85"/><circle cx="108" cy="190" r="2.1" fill="#8a6d16" fill-opacity="0.85"/><circle cx="118" cy="190" r="2.1" fill="#8a6d16" fill-opacity="0.85"/><circle cx="128" cy="190" r="2.1" fill="#8a6d16" fill-opacity="0.15"/><circle cx="138" cy="190" r="2.1" fill="#8a6d16" fill-opacity="0.15"/><rect x="156" y="120" width="62" height="62" rx="5" fill="#0d0d0d" fill-opacity="0.04" stroke="#0d0d0d" stroke-opacity="0.14"/><text x="187" y="152" text-anchor="middle" font-family="serif" font-size="24" fill="#0d0d0d" fill-opacity="0.32">影</text><text x="187" y="172" text-anchor="middle" font-family="serif" font-size="13" fill="#0d0d0d" fill-opacity="0.3">转</text><circle cx="168" cy="190" r="2.1" fill="#8a6d16" fill-opacity="0.85"/><circle cx="178" cy="190" r="2.1" fill="#8a6d16" fill-opacity="0.85"/><circle cx="188" cy="190" r="2.1" fill="#8a6d16" fill-opacity="0.15"/><circle cx="198" cy="190" r="2.1" fill="#8a6d16" fill-opacity="0.15"/><circle cx="208" cy="190" r="2.1" fill="#8a6d16" fill-opacity="0.15"/><rect x="226" y="120" width="62" height="62" rx="5" fill="#0d0d0d" fill-opacity="0.04" stroke="#0d0d0d" stroke-opacity="0.14"/><text x="257" y="152" text-anchor="middle" font-family="serif" font-size="24" fill="#0d0d0d" fill-opacity="0.32">断</text><text x="257" y="172" text-anchor="middle" font-family="serif" font-size="13" fill="#0d0d0d" fill-opacity="0.3">围</text><circle cx="238" cy="190" r="2.1" fill="#8a6d16" fill-opacity="0.85"/><circle cx="248" cy="190" r="2.1" fill="#8a6d16" fill-opacity="0.85"/><circle cx="258" cy="190" r="2.1" fill="#8a6d16" fill-opacity="0.15"/><circle cx="268" cy="190" r="2.1" fill="#8a6d16" fill-opacity="0.15"/><circle cx="278" cy="190" r="2.1" fill="#8a6d16" fill-opacity="0.15"/><text x="16" y="224" text-anchor="start" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#c1272d" fill-opacity="0.95">Acesa</text><text x="16" y="240" text-anchor="start" font-family="system-ui, sans-serif" font-size="9.5" font-weight="normal" fill="#0d0d0d" fill-opacity="0.45">A condição cumpre-se agora. A arte está a agir.</text><rect x="16" y="252" width="62" height="62" rx="5" fill="#c1272d" fill-opacity="0.1" stroke="#c1272d" stroke-opacity="0.9"/><text x="47" y="284" text-anchor="middle" font-family="serif" font-size="24" fill="#0d0d0d" fill-opacity="0.95">点</text><text x="47" y="304" text-anchor="middle" font-family="serif" font-size="13" fill="#c1272d" fill-opacity="1">静</text><circle cx="28" cy="322" r="2.1" fill="#8a6d16" fill-opacity="0.85"/><circle cx="38" cy="322" r="2.1" fill="#8a6d16" fill-opacity="0.85"/><circle cx="48" cy="322" r="2.1" fill="#8a6d16" fill-opacity="0.85"/><circle cx="58" cy="322" r="2.1" fill="#8a6d16" fill-opacity="0.15"/><circle cx="68" cy="322" r="2.1" fill="#8a6d16" fill-opacity="0.15"/><rect x="86" y="252" width="62" height="62" rx="5" fill="#0d0d0d" fill-opacity="0.04" stroke="#0d0d0d" stroke-opacity="0.14"/><text x="117" y="284" text-anchor="middle" font-family="serif" font-size="24" fill="#0d0d0d" fill-opacity="0.32">流</text><text x="117" y="304" text-anchor="middle" font-family="serif" font-size="13" fill="#0d0d0d" fill-opacity="0.3">疾</text><circle cx="98" cy="322" r="2.1" fill="#8a6d16" fill-opacity="0.85"/><circle cx="108" cy="322" r="2.1" fill="#8a6d16" fill-opacity="0.85"/><circle cx="118" cy="322" r="2.1" fill="#8a6d16" fill-opacity="0.85"/><circle cx="128" cy="322" r="2.1" fill="#8a6d16" fill-opacity="0.15"/><circle cx="138" cy="322" r="2.1" fill="#8a6d16" fill-opacity="0.15"/><rect x="156" y="252" width="62" height="62" rx="5" fill="#0d0d0d" fill-opacity="0.04" stroke="#0d0d0d" stroke-opacity="0.14"/><text x="187" y="284" text-anchor="middle" font-family="serif" font-size="24" fill="#0d0d0d" fill-opacity="0.32">影</text><text x="187" y="304" text-anchor="middle" font-family="serif" font-size="13" fill="#0d0d0d" fill-opacity="0.3">转</text><circle cx="168" cy="322" r="2.1" fill="#8a6d16" fill-opacity="0.85"/><circle cx="178" cy="322" r="2.1" fill="#8a6d16" fill-opacity="0.85"/><circle cx="188" cy="322" r="2.1" fill="#8a6d16" fill-opacity="0.15"/><circle cx="198" cy="322" r="2.1" fill="#8a6d16" fill-opacity="0.15"/><circle cx="208" cy="322" r="2.1" fill="#8a6d16" fill-opacity="0.15"/><rect x="226" y="252" width="62" height="62" rx="5" fill="#0d0d0d" fill-opacity="0.04" stroke="#0d0d0d" stroke-opacity="0.14"/><text x="257" y="284" text-anchor="middle" font-family="serif" font-size="24" fill="#0d0d0d" fill-opacity="0.32">断</text><text x="257" y="304" text-anchor="middle" font-family="serif" font-size="13" fill="#0d0d0d" fill-opacity="0.3">围</text><circle cx="238" cy="322" r="2.1" fill="#8a6d16" fill-opacity="0.85"/><circle cx="248" cy="322" r="2.1" fill="#8a6d16" fill-opacity="0.85"/><circle cx="258" cy="322" r="2.1" fill="#8a6d16" fill-opacity="0.15"/><circle cx="268" cy="322" r="2.1" fill="#8a6d16" fill-opacity="0.15"/><circle cx="278" cy="322" r="2.1" fill="#8a6d16" fill-opacity="0.15"/><text x="16" y="356" text-anchor="start" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#c1272d" fill-opacity="0.95">Outra acende</text><text x="16" y="372" text-anchor="start" font-family="system-ui, sans-serif" font-size="9.5" font-weight="normal" fill="#0d0d0d" fill-opacity="0.45">Corres em vez de parares: 静 apaga, 疾 acende.</text><rect x="16" y="384" width="62" height="62" rx="5" fill="#0d0d0d" fill-opacity="0.04" stroke="#0d0d0d" stroke-opacity="0.14"/><text x="47" y="416" text-anchor="middle" font-family="serif" font-size="24" fill="#0d0d0d" fill-opacity="0.32">点</text><text x="47" y="436" text-anchor="middle" font-family="serif" font-size="13" fill="#0d0d0d" fill-opacity="0.3">静</text><circle cx="28" cy="454" r="2.1" fill="#8a6d16" fill-opacity="0.85"/><circle cx="38" cy="454" r="2.1" fill="#8a6d16" fill-opacity="0.85"/><circle cx="48" cy="454" r="2.1" fill="#8a6d16" fill-opacity="0.85"/><circle cx="58" cy="454" r="2.1" fill="#8a6d16" fill-opacity="0.15"/><circle cx="68" cy="454" r="2.1" fill="#8a6d16" fill-opacity="0.15"/><rect x="86" y="384" width="62" height="62" rx="5" fill="#c1272d" fill-opacity="0.1" stroke="#c1272d" stroke-opacity="0.9"/><text x="117" y="416" text-anchor="middle" font-family="serif" font-size="24" fill="#0d0d0d" fill-opacity="0.95">流</text><text x="117" y="436" text-anchor="middle" font-family="serif" font-size="13" fill="#c1272d" fill-opacity="1">疾</text><circle cx="98" cy="454" r="2.1" fill="#8a6d16" fill-opacity="0.85"/><circle cx="108" cy="454" r="2.1" fill="#8a6d16" fill-opacity="0.85"/><circle cx="118" cy="454" r="2.1" fill="#8a6d16" fill-opacity="0.85"/><circle cx="128" cy="454" r="2.1" fill="#8a6d16" fill-opacity="0.15"/><circle cx="138" cy="454" r="2.1" fill="#8a6d16" fill-opacity="0.15"/><rect x="156" y="384" width="62" height="62" rx="5" fill="#0d0d0d" fill-opacity="0.04" stroke="#0d0d0d" stroke-opacity="0.14"/><text x="187" y="416" text-anchor="middle" font-family="serif" font-size="24" fill="#0d0d0d" fill-opacity="0.32">影</text><text x="187" y="436" text-anchor="middle" font-family="serif" font-size="13" fill="#0d0d0d" fill-opacity="0.3">转</text><circle cx="168" cy="454" r="2.1" fill="#8a6d16" fill-opacity="0.85"/><circle cx="178" cy="454" r="2.1" fill="#8a6d16" fill-opacity="0.85"/><circle cx="188" cy="454" r="2.1" fill="#8a6d16" fill-opacity="0.15"/><circle cx="198" cy="454" r="2.1" fill="#8a6d16" fill-opacity="0.15"/><circle cx="208" cy="454" r="2.1" fill="#8a6d16" fill-opacity="0.15"/><rect x="226" y="384" width="62" height="62" rx="5" fill="#0d0d0d" fill-opacity="0.04" stroke="#0d0d0d" stroke-opacity="0.14"/><text x="257" y="416" text-anchor="middle" font-family="serif" font-size="24" fill="#0d0d0d" fill-opacity="0.32">断</text><text x="257" y="436" text-anchor="middle" font-family="serif" font-size="13" fill="#0d0d0d" fill-opacity="0.3">围</text><circle cx="238" cy="454" r="2.1" fill="#8a6d16" fill-opacity="0.85"/><circle cx="248" cy="454" r="2.1" fill="#8a6d16" fill-opacity="0.85"/><circle cx="258" cy="454" r="2.1" fill="#8a6d16" fill-opacity="0.15"/><circle cx="268" cy="454" r="2.1" fill="#8a6d16" fill-opacity="0.15"/><circle cx="278" cy="454" r="2.1" fill="#8a6d16" fill-opacity="0.15"/><rect x="16" y="482" width="358" height="1" fill="#0d0d0d" fill-opacity="0.12"/><text x="16" y="506" text-anchor="start" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#0d0d0d" fill-opacity="0.45">O QUE O JOGADOR APRENDE</text><text x="16" y="522" text-anchor="start" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" fill="#0d0d0d" fill-opacity="0.85">静  Planta os pés</text><text x="32" y="537" text-anchor="start" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" fill="#0d0d0d" fill-opacity="0.5">e o teu golpe estreita e atravessa.</text><text x="16" y="556" text-anchor="start" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" fill="#0d0d0d" fill-opacity="0.85">疾  Não pares</text><text x="32" y="571" text-anchor="start" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" fill="#0d0d0d" fill-opacity="0.5">e os golpes vêm mais depressa.</text><text x="16" y="590" text-anchor="start" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" fill="#0d0d0d" fill-opacity="0.85">转  Inverte de repente</text><text x="32" y="605" text-anchor="start" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" fill="#0d0d0d" fill-opacity="0.5">e fica um eco do golpe onde estavas.</text><text x="16" y="624" text-anchor="start" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" fill="#0d0d0d" fill-opacity="0.85">围  Deixa-te rodear</text><text x="32" y="639" text-anchor="start" font-family="system-ui, sans-serif" font-size="10.5" font-weight="normal" fill="#0d0d0d" fill-opacity="0.5">e o golpe corta a dobrar.</text><rect x="16" y="712" width="358" height="74" rx="4" fill="#d4af37" fill-opacity="0.09" stroke="#d4af37" stroke-opacity="0.5"/><text x="30" y="736" text-anchor="start" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#8a6d16" fill-opacity="0.95">Porque não há botão</text><text x="30" y="754" text-anchor="start" font-family="system-ui, sans-serif" font-size="9.5" font-weight="normal" fill="#0d0d0d" fill-opacity="0.55">Um interruptor auto/manual obriga a desenhar</text><text x="30" y="768" text-anchor="start" font-family="system-ui, sans-serif" font-size="9.5" font-weight="normal" fill="#0d0d0d" fill-opacity="0.55">cada arte duas vezes e a equilibrar o jogo duas</text><text x="30" y="782" text-anchor="start" font-family="system-ui, sans-serif" font-size="9.5" font-weight="normal" fill="#0d0d0d" fill-opacity="0.55">vezes. Se fizer falta, um botão — não um modo.</text></g></svg>