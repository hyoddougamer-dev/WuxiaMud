1272d" fill-opacity="0.95">Não. Primeiro fazer agir o que já lá está.</text><text x="16" y="998" text-anchor="start" font-family="system-ui, sans-serif" font-size="10" font-weight="normal" fill="#0d0d0d" fill-opacity="0.55">30 artes e 22 itens já são mais conteúdo do que a</text><text x="16" y="1012" text-anchor="start" font-family="system-ui, sans-serif" font-size="10" font-weight="normal" fill="#0d0d0d" fill-opacity="0.55">simulação usa. Acrescentar linhas a uma tabela inerte</text><text x="16" y="1026" text-anchor="start" font-family="system-ui, sans-serif" font-size="10" font-weight="normal" fill="#0d0d0d" fill-opacity="0.55">multiplica o problema que estás a ver: mais coisas no ecrã</text><text x="16" y="1040" text-anchor="start" font-family="system-ui, sans-serif" font-size="10" font-weight="normal" fill="#0d0d0d" fill-opacity="0.55">que não fazem nada.</text><text x="20" y="1073" text-anchor="start" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0d0d0d" fill-opacity="0.25">1</text><text x="36" y="1073" text-anchor="start" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0d0d0d" fill-opacity="0.88">Efeitos das artes</text><text x="36" y="1087" text-anchor="start" font-family="system-ui, sans-serif" font-size="9" font-weight="normal" fill="#0d0d0d" fill-opacity="0.45">os 10 que a sim já sabe fazer, medidos com regions.mts</text><text x="20" y="1107" text-anchor="start" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0d0d0d" fill-opacity="0.25">2</text><text x="36" y="1107" text-anchor="start" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0d0d0d" fill-opacity="0.88">Equipar 4 e ordenar</text><text x="36" y="1121" text-anchor="start" font-family="system-ui, sans-serif" font-size="9" font-weight="normal" fill="#0d0d0d" fill-opacity="0.45">a barra passa a mostrar a tua build, não o rolo todo</text><text x="20" y="1141" text-anchor="start" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0d0d0d" fill-opacity="0.25">3</text><text x="36" y="1141" text-anchor="start" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0d0d0d" fill-opacity="0.88">Os 6 efeitos novos</text><text x="36" y="1155" text-anchor="start" font-family="system-ui, sans-serif" font-size="9" font-weight="normal" fill="#0d0d0d" fill-opacity="0.45">pierce, crit, echo, push, guard, heal — um de cada vez</text><text x="20" y="1175" text-anchor="start" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0d0d0d" fill-opacity="0.25">4</text><text x="36" y="1175" text-anchor="start" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0d0d0d" fill-opacity="0.88">秘笈 caem e ensinam</text><text x="36" y="1189" text-anchor="start" font-family="system-ui, sans-serif" font-size="9" font-weight="normal" fill="#0d0d0d" fill-opacity="0.45">e as 3 cartas da corrida saem</text><text x="20" y="1209" text-anchor="start" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0d0d0d" fill-opacity="0.25">5</text><text x="36" y="1209" text-anchor="start" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0d0d0d" fill-opacity="0.88">Os 4 slots novos</text><text x="36" y="1223" text-anchor="start" font-family="system-ui, sans-serif" font-size="9" font-weight="normal" fill="#0d0d0d" fill-opacity="0.45">guarda-roupa primeiro; itens depois</text></svg>