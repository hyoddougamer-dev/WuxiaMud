<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1242" viewBox="0 0 390 1242"><rect width="390" height="1242" fill="#e8dcc0"/><text x="16" y="34" text-anchor="start" font-family="system-ui, sans-serif" font-size="19" font-weight="600" fill="#0d0d0d" fill-opacity="0.92">O que existe, e o que age</text><text x="16" y="54" text-anchor="start" font-family="system-ui, sans-serif" font-size="9.5" font-weight="normal" fill="#0d0d0d" fill-opacity="0.45">Contado a partir dos módulos reais quando esta folha é gerada. Se</text><text x="16" y="67.5" text-anchor="start" font-family="system-ui, sans-serif" font-size="9.5" font-weight="normal" fill="#0d0d0d" fill-opacity="0.45">um número aqui estiver errado, é o código que mudou.</text><text x="16" y="89" text-anchor="start" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#8a6d16" fill-opacity="0.9">A CORRIDA — TUDO ISTO AGE</text><rect x="16" y="103" width="358" height="46" rx="4" fill="#0d0d0d" fill-opacity="0.025" stroke="#0d0d0d" stroke-opacity="0.16"/><text x="26" y="121" text-anchor="start" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0d0d0d" fill-opacity="0.9">Itens</text><text x="26" y="136" text-anchor="start" font-family="system-ui, sans-serif" font-size="9" font-weight="normal" fill="#0d0d0d" fill-opacity="0.45">weapon 6 · head 5 · shoulders 5 · robe 6</text><text x="364" y="121" text-anchor="end" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0d0d0d" fill-opacity="0.75">22</text><text x="364" y="136" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#8a6d16" fill-opacity="0.85">age no jogo</text><rect x="16" y="157" width="358" height="46" rx="4" fill="#0d0d0d" fill-opacity="0.025" stroke="#0d0d0d" stroke-opacity="0.16"/><text x="26" y="175" text-anchor="start" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0d0d0d" fill-opacity="0.9">Linhas de stat</text><text x="26" y="190" text-anchor="start" font-family="system-ui, sans-serif" font-size="9" font-weight="normal" fill="#0d0d0d" fill-opacity="0.45">um atributo cada · graus 0–5, +30% por grau</text><text x="364" y="175" text-anchor="end" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0d0d0d" fill-opacity="0.75">16</text><text x="364" y="190" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#8a6d16" fill-opacity="0.85">age no jogo</text><rect x="16" y="211" width="358" height="46" rx="4" fill="#0d0d0d" fill-opacity="0.025" stroke="#0d0d0d" stroke-opacity="0.16"/><text x="26" y="229" text-anchor="start" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0d0d0d" fill-opacity="0.9">Atributos</text><text x="26" y="244" text-anchor="start" font-family="system-ui, sans-serif" font-size="9" font-weight="normal" fill="#0d0d0d" fill-opacity="0.45">Body · Edge · Swiftness · Spirit</text><text x="364" y="229" text-anchor="end" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0d0d0d" fill-opacity="0.75">4</text><text x="364" y="244" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#8a6d16" fill-opacity="0.85">age no jogo</text><rect x="16" y="265" width="358" height="46" rx="4" fill="#0d0d0d" fill-opacity="0.025" stroke="#0d0d0d" stroke-opacity="0.16"/><text x="26" y="283" text-anchor="start" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0d0d0d" fill-opacity="0.9">Armas</text><text x="26" y="298" text-anchor="start" font-family="system-ui, sans-serif" font-size="9" font-weight="normal" fill="#0d0d0d" fill-opacity="0.45">cada uma muda como o golpe varre</text><text x="364" y="283" text-anchor="end" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0d0d0d" fill-opacity="0.75">6</text><text x="364" y="298" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#8a6d16" fill-opacity="0.85">age no jogo</text><rect x="16" y="319" width="358" height="46" rx="4" fill="#0d0d0d" fill-opacity="0.025" stroke="#0d0d0d" stroke-opacity="0.16"/><text x="26" y="337" text-anchor="start" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0d0d0d" fill-opacity="0.9">Inimigos</text><text x="26" y="352" text-anchor="start" font-family="system-ui, sans-serif" font-size="9" font-weight="normal" fill="#0d0d0d" fill-opacity="0.45">com os comportamentos por região</text><text x="364" y="337" text-anchor="end" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0d0d0d" fill-opacity="0.75">21</text><text x="364" y="352" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#8a6d16" fill-opacity="0.85">age no jogo</text><rect x="16" y="373" width="358" height="46" rx="4" fill="#0d0d0d" fill-opacity="0.025" stroke="#0d0d0d" stroke-opacity="0.16"/><text x="26" y="391" text-anchor="start" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0d0d0d" fill-opacity="0.9">Regiões</text><text x="26" y="406" text-anchor="start" font-family="system-ui, sans-serif" font-size="9" font-weight="normal" fill="#0d0d0d" fill-opacity="0.45">cada uma com a sua regra</text><text x="364" y="391" text-anchor="end" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0d0d0d" fill-opacity="0.75">5</text><text x="364" y="406" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#8a6d16" fill-opacity="0.85">age no jogo</text><rect x="16" y="431" width="358" height="1" fill="#0d0d0d" fill-opacity="0.14"/><text x="16" y="453" text-anchor="start" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#c1272d" fill-opacity="0.95">AS ARTES — DEFINIDAS, MAS NÃO AGEM</text><text x="16" y="467" text-anchor="start" font-family="system-ui, sans-serif" font-size="9.5" font-weight="normal" fill="#0d0d0d" fill-opacity="0.5">É isto que te confundiu, e a culpa é minha: pus ícones numa</text><text x="16" y="480.5" text-anchor="start" font-family="system-ui, sans-serif" font-size="9.5" font-weight="normal" fill="#0d0d0d" fill-opacity="0.5">barra que acende certo e não faz nada a seguir.</text><rect x="16" y="500" width="358" height="46" rx="4" fill="#0d0d0d" fill-opacity="0.025" stroke="#c1272d" stroke-opacity="0.4"/><text x="26" y="518" text-anchor="start" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0d0d0d" fill-opacity="0.9">Artes 功法</text><text x="26" y="533" text-anchor="start" font-family="system-ui, sans-serif" font-size="9" font-weight="normal" fill="#0d0d0d" fill-opacity="0.45">6 armas × 5 · graus 1–5</text><text x="364" y="518" text-anchor="end" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0d0d0d" fill-opacity="0.75">30</text><text x="364" y="533" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#c1272d" fill-opacity="0.95">INERTE</text><rect x="16" y="554" width="358" height="46" rx="4" fill="#0d0d0d" fill-opacity="0.025" stroke="#c1272d" stroke-opacity="0.4"/><text x="26" y="572" text-anchor="start" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0d0d0d" fill-opacity="0.9">Efeitos</text><text x="26" y="587" text-anchor="start" font-family="system-ui, sans-serif" font-size="9" font-weight="normal" fill="#0d0d0d" fill-opacity="0.45">10 já existem na sim · 6 são código novo</text><text x="364" y="572" text-anchor="end" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0d0d0d" fill-opacity="0.75">16</text><text x="364" y="587" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#c1272d" fill-opacity="0.95">INERTE</text><rect x="16" y="608" width="358" height="46" rx="4" fill="#0d0d0d" fill-opacity="0.025" stroke="#0d0d0d" stroke-opacity="0.16"/><text x="26" y="626" text-anchor="start" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0d0d0d" fill-opacity="0.9">Condições</text><text x="26" y="641" text-anchor="start" font-family="system-ui, sans-serif" font-size="9" font-weight="normal" fill="#0d0d0d" fill-opacity="0.45">estas SIM: a barra acende quando se cumprem</text><text x="364" y="626" text-anchor="end" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0d0d0d" fill-opacity="0.75">5</text><text x="364" y="641" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#8a6d16" fill-opacity="0.85">age no jogo</text><rect x="16" y="662" width="358" height="46" rx="4" fill="#0d0d0d" fill-opacity="0.025" stroke="#c1272d" stroke-opacity="0.4"/><text x="26" y="680" text-anchor="start" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0d0d0d" fill-opacity="0.9">Equipar 4 e ordenar</text><text x="26" y="695" text-anchor="start" font-family="system-ui, sans-serif" font-size="9" font-weight="normal" fill="#0d0d0d" fill-opacity="0.45">4 previstas · a barra mostra as 5 da arma</text><text x="364" y="680" text-anchor="end" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0d0d0d" fill-opacity="0.75">0</text><text x="364" y="695" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#c1272d" fill-opacity="0.95">INERTE</text><rect x="16" y="716" width="358" height="46" rx="4" fill="#0d0d0d" fill-opacity="0.025" stroke="#c1272d" stroke-opacity="0.4"/><text x="26" y="734" text-anchor="start" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0d0d0d" fill-opacity="0.9">秘笈 manuais que caem</text><text x="26" y="749" text-anchor="start" font-family="system-ui, sans-serif" font-size="9" font-weight="normal" fill="#0d0d0d" fill-opacity="0.45">aprender uma arte ainda não existe</text><text x="364" y="734" text-anchor="end" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0d0d0d" fill-opacity="0.75">0</text><text x="364" y="749" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#c1272d" fill-opacity="0.95">INERTE</text><rect x="16" y="774" width="358" height="1" fill="#0d0d0d" fill-opacity="0.14"/><text x="16" y="796" text-anchor="start" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#0d0d0d" fill-opacity="0.5">OS SLOTS DE EQUIPAMENTO</text><rect x="16" y="812" width="83.5" height="54" rx="4" fill="#0d0d0d" fill-opacity="0.03" stroke="#0d0d0d" stroke-opacity="0.16"/><text x="57.75" y="832" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#0d0d0d" fill-opacity="0.85">器 Arma</text><text x="57.75" y="846" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" font-weight="normal" fill="#8a6d16" fill-opacity="0.85">6 itens</text><text x="57.75" y="858" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" font-weight="normal" fill="#0d0d0d" fill-opacity="0.3">katana</text><rect x="105.5" y="812" width="83.5" height="54" rx="4" fill="#0d0d0d" fill-opacity="0.03" stroke="#0d0d0d" stroke-opacity="0.16"/><text x="147.25" y="832" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#0d0d0d" fill-opacity="0.85">首 Cabeça</text><text x="147.25" y="846" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" font-weight="normal" fill="#8a6d16" fill-opacity="0.85">5 itens</text><text x="147.25" y="858" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" font-weight="normal" fill="#0d0d0d" fill-opacity="0.3">asian-lantern</text><rect x="195" y="812" width="83.5" height="54" rx="4" fill="#0d0d0d" fill-opacity="0.03" stroke="#0d0d0d" stroke-opacity="0.16"/><text x="236.75" y="832" text-anch