<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    a { color: #8a6d16; } a:hover { color: #c1272d; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #e8dcc0; color: #0d0d0d; display: flex; flex-direction: column; overflow: hidden;">

  <!-- character strip, lifted from the hub's existing header -->
  <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px 11px; border-bottom: 1px solid rgba(13,13,13,0.12);">
    <div style="width: 42px; height: 42px; background: #c1272d; color: #e8dcc0; display: grid; place-content: center; font-size: 14px; letter-spacing: -1px; border-radius: 2px;">淬体</div>
    <div style="flex-grow: 1; min-width: 0;">
      <div style="font-size: 16px; font-weight: 600;">Fang Jinlong</div>
      <div style="display: flex; align-items: baseline; gap: 7px; font-size: 12px; color: rgba(13,13,13,0.5);">
        <span>Body Tempering</span><span style="color: #8a6d16; font-weight: 600;">Level 6</span>
      </div>
    </div>
  </div>

  <!-- ---------- the worn set, around the figure ---------- -->
  <div style="position: relative; height: 226px; flex: none; border-bottom: 1px solid rgba(13,13,13,0.1);">

    <!-- the swordsman, same silhouette language the game draws -->
    <svg viewBox="0 0 80 120" width="86" height="129" style="position: absolute; left: 152px; top: 44px;" aria-hidden="true">
      <ellipse cx="40" cy="115" rx="20" ry="4" fill="rgba(13,13,13,0.12)"/>
      <path d="M40 108 L26 108 L30 56 L50 56 L54 108 Z" fill="#0d0d0d"/>
      <path d="M30 56 L50 56 L47 40 L33 40 Z" fill="#0d0d0d"/>
      <circle cx="40" cy="30" r="10" fill="#0d0d0d"/>
      <path d="M40 44 L34 56 L40 62 L46 56 Z" fill="#e8dcc0"/>
      <path d="M33 62 Q26 82 30 100" stroke="#c1272d" stroke-width="4" fill="none" stroke-linecap="round"/>
    </svg>

    <!-- 剑 weapon -->
    <div style="position: absolute; left: 18px; top: 26px; width: 118px;">
      <div style="font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(13,13,13,0.4); margin-bottom: 5px;">剑 Weapon</div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 8px 9px; background: rgba(13,13,13,0.9); border-radius: 2px; border-left: 3px solid #6b3f8a;">
        <svg viewBox="0 0 24 24" width="22" height="22" style="flex: none;" aria-hidden="true">
          <path d="M11 3h2v11l-1 3-1-3z" fill="#e8dcc0"/><path d="M7 3h10v1.6H7z" fill="#e8dcc0"/>
        </svg>
        <div style="min-width: 0;">
          <div style="font-size: 12px; font-weight: 600; color: #a878c4;">宝 Iron Fan</div>
          <div style="font-size: 10px; color: rgba(232,220,192,0.6);">+9 Edge · +6 Spirit</div>
        </div>
      </div>
    </div>

    <!-- 首 head -->
    <div style="position: absolute; right: 18px; top: 26px; width: 118px;">
      <div style="font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(13,13,13,0.4); margin-bottom: 5px; text-align: right;">首 Head</div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 8px 9px; background: rgba(13,13,13,0.9); border-radius: 2px; border-left: 3px solid #3f6b46;">
        <svg viewBox="0 0 24 24" width="22" height="22" style="flex: none;" aria-hidden="true">
          <path d="M12 5l5 8H7z" fill="#e8dcc0"/><path d="M3 13h18l-2 2.6H5z" fill="#e8dcc0"/>
        </svg>
        <div style="min-width: 0;">
          <div style="font-size: 12px; font-weight: 600; color: #6fa87a;">良 Loose Hair</div>
          <div style="font-size: 10px; color: rgba(232,220,192,0.6);">+4 Swiftness</div>
        </div>
      </div>
    </div>

    <!-- 肩 shoulders -->
    <div style="position: absolute; left: 18px; bottom: 16px; width: 118px;">
      <div style="font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(13,13,13,0.4); margin-bottom: 5px;">肩 Shoulders</div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 8px 9px; background: rgba(13,13,13,0.9); border-radius: 2px; border-left: 3px solid #6b6459;">
        <svg viewBox="0 0 24 24" width="22" height="22" style="flex: none;" aria-hidden="true">
          <path d="M4 8l8 5 8-5v3l-8 5-8-5z" fill="#e8dcc0"/><path d="M5.6 14.6L12 18.6l6.4-4v3L12 21.6l-6.4-4z" fill="#e8dcc0"/>
        </svg>
        <div style="min-width: 0;">
          <div style="font-size: 12px; font-weight: 600; color: #9c948a;">凡 Bare Arms</div>
          <div style="font-size: 10px; color: rgba(232,220,192,0.6);">+4 Swiftness</div>
        </div>
      </div>
    </div>

    <!-- 衣 robe -->
    <div style="position: absolute; right: 18px; bottom: 16px; width: 118px;">
      <div style="font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(13,13,13,0.4); margin-bottom: 5px; text-align: right;">衣 Robe</div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 8px 9px; background: rgba(13,13,13,0.9); border-radius: 2px; border-left: 3px solid #2f5d8a;">
        <svg viewBox="0 0 24 24" width="22" height="22" style="flex: none;" aria-hidden="true">
          <path d="M3 7h18v3H3z" fill="#e8dcc0"/><path d="M8.6 6h6.8l2 15H6.6z" fill="#e8dcc0"/><path d="M10 6h4l-2 3.6z" fill="#0d0d0d"/>
        </svg>
        <div style="min-width: 0;">
          <div style="font-size: 12px; font-weight: 600; color: #4f80b3;">珍 Lamellar Skirt</div>
          <div style="font-size: 10px; color: rgba(232,220,192,0.6);">+21 Health · +6 Body</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ---------- the bag ---------- -->
  <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 12px 16px 8px;">
    <div style="font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: #8a6d16;">囊 The pack</div>
    <div style="font-size: 11px; color: rgba(13,13,13,0.45); font-variant-numeric: tabular-nums;">14 / 24</div>
  </div>
  <div style="height: 2px; margin: 0 16px 10px; background: rgba(13,13,13,0.1);">
    <div style="width: 58%; height: 100%; background: #8a6d16;"></div>
  </div>

  <div style="flex-grow: 1; overflow: hidden; padding: 0 16px;">
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">

      <!-- 仙, the one you tap first -->
      <div style="position: relative; height: 78px; border: 1px solid rgba(13,13,13,0.12); border-top: 3px solid #c1272d; border-radius: 2px; background: rgba(193,39,45,0.07); display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M11 3h2v11l-1 3-1-3z" fill="#0d0d0d"/><path d="M7 3h10v1.6H7z" fill="#0d0d0d"/></svg>
        <span style="position: absolute; top: 3px; right: 5px; font-size: 10px; color: #c1272d;">仙</span>
        <span style="position: absolute; bottom: 3px; left: 5px; font-size: 8px; letter-spacing: 0.1em; color: rgba(193,39,45,0.75);">NEW</span>
      </div>

      <div style="position: relative; height: 78px; border: 1px solid rgba(13,13,13,0.12); border-top: 3px solid #8a6d16; border-radius: 2px; background: rgba(255,252,244,0.5); display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M3 7h18v3H3z" fill="#0d0d0d"/><path d="M8.6 6h6.8l2 15H6.6z" fill="#0d0d0d"/><path d="M10 6h4l-2 3.6z" fill="#e8dcc0"/></svg>
        <span style="position: absolute; top: 3px; right: 5px; font-size: 10px; color: #8a6d16;">神</span>
      </div>

      <div style="position: relative; height: 78px; border: 1px solid rgba(13,13,13,0.12); border-top: 3px solid #6b3f8a; border-radius: 2px; background: rgba(255,252,244,0.5); display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M12 5l5 8H7z" fill="#0d0d0d"/><path d="M3 13h18l-2 2.6H5z" fill="#0d0d0d"/></svg>
        <span style="position: absolute; top: 3px; right: 5px; font-size: 10px; color: #6b3f8a;">宝</span>
      </div>

      <div style="position: relative; height: 78px; border: 1px solid rgba(13,13,13,0.12); border-top: 3px solid #2f5d8a; border-radius: 2px; background: rgba(255,252,244,0.5); display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M4 8l8 5 8-5v3l-8 5-8-5z" fill="#0d0d0d"/><path d="M5.6 14.6L12 18.6l6.4-4v3L12 21.6l-6.4-4z" fill="#0d0d0d"/></svg>
        <span style="position: absolute; top: 3px; right: 5px; font-size: 10px; color: #2f5d8a;">珍</span>
      </div>

      <div style="position: relative; height: 78px; border: 1px solid rgba(13,13,13,0.12); border-top: 3px solid #3f6b46; border-radius: 2px; background: rgba(255,252,244,0.5); display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M11 3h2v11l-1 3-1-3z" fill="#0d0d0d"/><path d="M7 3h10v1.6H7z" fill="#0d0d0d"/></svg>
        <span style="position: absolute; top: 3px; right: 5px; font-size: 10px; color: #3f6b46;">良</span>
      </div>

      <div style="position: relative; height: 78px; border: 1px solid rgba(13,13,13,0.12); border-top: 3px solid #3f6b46; border-radius: 2px; background: rgba(255,252,244,0.5); display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M3 7h18v3H3z" fill="#0d0d0d"/><path d="M8.6 6h6.8l2 15H6.6z" fill="#0d0d0d"/><path d="M10 6h4l-2 3.6z" fill="#e8dcc0"/></svg>
        <span style="position: absolute; top: 3px; right: 5px; font-size: 10px; color: #3f6b46;">良</span>
      </div>

      <div style="position: relative; height: 78px; border: 1px solid rgba(13,13,13,0.12); border-top: 3px solid #6b6459; border-radius: 2px; background: rgba(255,252,244,0.5); display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M12 5l5 8H7z" fill="#0d0d0d"/><path d="M3 13h18l-2 2.6H5z" fill="#0d0d0d"/></svg>
        <span style="position: absolute; top: 3px; right: 5px; font-size: 10px; color: #6b6459;">凡</span>
      </div>

      <div style="position: relative; height: 78px; border: 1px solid rgba(13,13,13,0.12); border-top: 3px solid #6b6459; border-radius: 2px; background: rgba(255,252,244,0.5); display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M4 8l8 5 8-5v3l-8 5-8-5z" fill="#0d0d0d"/><path d="M5.6 14.6L12 18.6l6.4-4v3L12 21.6l-6.4-4z" fill="#0d0d0d"/></svg>
        <span style="position: absolute; top: 3px; right: 5px; font-size: 10px; color: #6b6459;">凡</span>
      </div>

      <div style="position: relative; height: 78px; border: 1px solid rgba(13,13,13,0.12); border-top: 3px solid #2f5d8a; border-radius: 2px; background: rgba(255,252,244,0.5); display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M11 3h2v11l-1 3-1-3z" fill="#0d0d0d"/><path d="M7 3h10v1.6H7z" fill="#0d0d0d"/></svg>
        <span style="position: absolute; top: 3px; right: 5px; font-size: 10px; color: #2f5d8a;">珍</span>
      </div>

      <div style="position: relative; height: 78px; border: 1px solid rgba(13,13,13,0.12); border-top: 3px solid #6b6459; border-radius: 2px; background: rgba(255,252,244,0.5); display: grid; place-items: center;">
        <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M3 7h18v3H3z" fill="#0d0d0d"/><path d="M8.6 6h6.8l2 15H6.6z" fill="#0d0d0d"/><path d="M10 6h4l-2 3.6z" fill="#e8dcc0"/></svg>
        <span style="position: absolute; top: 3px; right: 5px; font-size: 10px; color: #6b6459;">凡</span>
      </div>

      <div style="height: 78px; border: 1px dashed rgba(13,13,13,0.16); border-radius: 2px;"></div>
      <div style="height: 78px; border: 1px dashed rgba(13,13,13,0.16); border-radius: 2px;"></div>
    </div>
  </div>

  <!-- the hub's own tab bar -->
  <div style="display: flex; border-top: 1px solid rgba(13,13,13,0.12); background: rgba(13,13,13,0.03);">
    <div style="flex: 1; padding: 9px 0 10px; text-align: center; color: rgba(13,13,13,0.4);">
      <div style="font-size: 16px;">剑</div><div style="font-size: 9px; letter-spacing: 0.06em;">SWORDSMAN</div>
    </div>
    <div style="flex: 1; padding: 9px 0 10px; text-align: center; color: #0d0d0d; background: #e8dcc0; border-top: 2px solid #c1272d; margin-top: -1px;">
      <div style="font-size: 16px;">装</div><div style="font-size: 9px; letter-spacing: 0.06em;">EQUIPMENT</div>
    </div>
    <div style="flex: 1; padding: 9px 0 10px; text-align: center; color: rgba(13,13,13,0.4);">
      <div style="font-size: 16px;">法</div><div style="font-size: 9px; letter-spacing: 0.06em;">ARTS</div>
    </div>
    <div style="flex: 1; padding: 9px 0 10px; text-align: center; color: rgba(13,13,13,0.4);">
      <div style="font-size: 16px;">界</div><div style="font-size: 9px; letter-spacing: 0.06em;">WORLD</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
