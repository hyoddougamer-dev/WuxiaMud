<div style="width: 390px; height: 844px; background: #e8dcc0; color: #0d0d0d; display: flex; flex-direction: column; overflow: hidden;">

      <div style="display: flex; align-items: baseline; gap: 7px; font-size: 12px; color: rgba(13,13,13,0.5);">
        <span>Body Tempering</span><span style="color: #8a6d16; font-weight: 600;">Level 6</span>
      </div>
    </div>
  </div>

  <!-- worn, as one compact row: four chips, always visible -->
  <div style="display: flex; gap: 6px; padding: 10px 16px 12px; border-bottom: 1px solid rgba(13,13,13,0.1);">
    <div style="flex: 1; height: 50px; border-radius: 2px; background: rgba(13,13,13,0.9); border-bottom: 3px solid #6b3f8a; display: grid; place-items: center; position: relative;">

    <div style="flex: 1; height: 50px; border-radius: 2px; background: rgba(13,13,13,0.9); border-bottom: 3px solid #3f6b46; display: grid; place-items: center; position: relative;">
