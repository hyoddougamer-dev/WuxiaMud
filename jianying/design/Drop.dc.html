<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    a { color: #8a6d16; } a:hover { color: #c1272d; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #e8dcc0; color: #0d0d0d; position: relative; overflow: hidden;">

  <!-- paper grain -->
  <div style="position: absolute; inset: 0; opacity: 0.5; background-image: radial-gradient(circle at 18% 22%, rgba(13,13,13,0.05) 0 1px, transparent 1px), radial-gradient(circle at 68% 44%, rgba(13,13,13,0.04) 0 1px, transparent 1px), radial-gradient(circle at 38% 74%, rgba(13,13,13,0.05) 0 1px, transparent 1px); background-size: 90px 90px, 130px 130px, 70px 70px;"></div>

  <!-- rift hairline at the very top edge -->
  <div style="position: absolute; top: 0; left: 0; right: 0; height: 3px; background: rgba(13,13,13,0.12);">
    <div style="width: 58%; height: 100%; background: #c1272d;"></div>
  </div>

  <div style="position: absolute; top: 12px; left: 0; right: 0; text-align: center; font-size: 11px; color: rgba(13,13,13,0.32); letter-spacing: 0.04em;">60 fps · 84e · webgl · 1.11.0</div>

  <!-- enemies -->
  <div style="position: absolute; top: 210px; left: 62px; width: 20px; height: 34px; background: #0d0d0d; opacity: 0.85; border-radius: 40% 40% 20% 20%;"></div>
  <div style="position: absolute; top: 268px; left: 292px; width: 18px; height: 30px; background: #0d0d0d; opacity: 0.8; border-radius: 40% 40% 20% 20%;"></div>
  <div style="position: absolute; top: 176px; left: 236px; width: 17px; height: 28px; background: #0d0d0d; opacity: 0.7; border-radius: 40% 40% 20% 20%;"></div>
  <div style="position: absolute; top: 348px; left: 106px; width: 18px; height: 30px; background: #0d0d0d; opacity: 0.75; border-radius: 40% 40% 20% 20%;"></div>

  <!-- the legendary drop: a shaft of light on the ground, then the label -->
  <div style="position: absolute; left: 172px; top: 300px; width: 46px; height: 150px; background: linear-gradient(to top, rgba(212,175,55,0.42), rgba(212,175,55,0)); border-radius: 50% 50% 0 0 / 14% 14% 0 0;"></div>
  <div style="position: absolute; left: 176px; top: 438px; width: 38px; height: 11px; border-radius: 50%; background: rgba(212,175,55,0.55);"></div>

  <div style="position: absolute; left: 96px; top: 262px; display: flex; flex-direction: column; align-items: center; gap: 3px;">
    <div style="background: rgba(232,220,192,0.96); border: 1px solid #8a6d16; border-radius: 2px; padding: 6px 13px; box-shadow: 0 2px 10px rgba(13,13,13,0.18), inset 0 0 14px rgba(212,175,55,0.3); text-align: center;">
      <div style="font-size: 13.5px; font-weight: 700; color: #8a6d16; letter-spacing: 0.01em;">Frostbound Jian</div>
      <div style="font-size: 10px; color: rgba(13,13,13,0.5); margin-top: 1px;">神 · Divina</div>
    </div>
    <div style="width: 1px; height: 34px; background: rgba(138,109,22,0.5);"></div>
  </div>

  <!-- a common drop nearby, deliberately quiet -->
  <div style="position: absolute; left: 258px; top: 388px; display: flex; flex-direction: column; align-items: center; gap: 3px;">
    <div style="background: rgba(232,220,192,0.8); border: 1px solid rgba(13,13,13,0.22); border-radius: 2px; padding: 4px 10px;">
      <div style="font-size: 11px; color: #6b6459;">Hemp Robe</div>
    </div>
    <div style="width: 1px; height: 20px; background: rgba(13,13,13,0.2);"></div>
  </div>

  <!-- the swordsman, mid-sweep -->
  <div style="position: absolute; left: 150px; top: 452px;">
    <svg width="90" height="120" viewBox="0 0 90 120" aria-hidden="true">
      <path d="M8 46a44 44 0 0 0 74 22" stroke="#0d0d0d" stroke-width="7" fill="none" opacity="0.2" stroke-linecap="round"/>
      <ellipse cx="45" cy="106" rx="20" ry="5" fill="#0d0d0d" opacity="0.14"/>
      <path d="M45 18c5 0 9 4 9 9s-4 10-9 10-9-5-9-10 4-9 9-9z" fill="#0d0d0d"/>
      <path d="M45 10c4 0 6 3 6 6s-2 5-6 5-6-2-6-5 2-6 6-6z" fill="#0d0d0d"/>
      <path d="M30 40c3-5 9-7 15-7s12 2 15 7c5 8 6 20 6 34 0 16-2 21-4 26H28c-2-5-4-10-4-26 0-14 1-26 6-34z" fill="#0d0d0d"/>
      <path d="M40 42h10l-5 12z" fill="#e8dcc0"/>
      <path d="M62 34 88 12" stroke="#0d0d0d" stroke-width="2.5" fill="none"/>
      <path d="M36 76c-2 16-1 24 2 30" stroke="#c1272d" stroke-width="3.5" fill="none" opacity="0.85"/>
    </svg>
  </div>

  <!-- floaters: a crit, and a mend -->
  <div style="position: absolute; left: 236px; top: 306px; font-size: 21px; font-weight: 700; color: #0d0d0d; opacity: 0.85;">86</div>
  <div style="position: absolute; left: 118px; top: 424px; font-size: 14px; font-weight: 600; color: #3f6b46;">+7</div>

  <!-- the C 底 console, unchanged from the shipped HUD -->
  <div style="position: absolute; left: 16px; right: 16px; bottom: 96px;">
    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; font-variant-numeric: tabular-nums;">
      <span style="font-size: 15px; font-weight: 600;">118</span>
      <span style="font-size: 12px; color: rgba(13,13,13,0.45);">2:41</span>
    </div>
    <div style="height: 6px; background: rgba(13,13,13,0.1); border-radius: 3px; overflow: hidden;">
      <div style="width: 74%; height: 100%; background: #0d0d0d;"></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px;">
      <div style="aspect-ratio: 1; border: 1px solid rgba(13,13,13,0.16); border-radius: 4px; background: rgba(255,252,244,0.35); display: grid; place-content: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0d0d0d" stroke-width="1.6" opacity="0.7" aria-hidden="true"><path d="M3 20 20 4M14 4h6v6"/></svg>
      </div>
      <div style="aspect-ratio: 1; border: 1px solid #c1272d; border-radius: 4px; background: rgba(193,39,45,0.07); display: grid; place-content: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0d0d0d" stroke-width="1.6" opacity="0.8" aria-hidden="true"><path d="M4 6c6 0 10 4 10 12"/><path d="M14 18h6"/></svg>
      </div>
      <div style="aspect-ratio: 1; border: 1px solid rgba(13,13,13,0.16); border-radius: 4px; background: rgba(255,252,244,0.35); display: grid; place-content: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0d0d0d" stroke-width="1.6" opacity="0.7" aria-hidden="true"><path d="M5 19 12 5l7 14"/><path d="M8 15h8"/></svg>
      </div>
      <div style="aspect-ratio: 1; border: 1px solid rgba(13,13,13,0.16); border-radius: 4px; background: rgba(255,252,244,0.35); display: grid; place-content: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0d0d0d" stroke-width="1.6" opacity="0.7" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 5v14"/></svg>
      </div>
    </div>
  </div>

  <!-- the note, outside the phone's own language -->
  <div style="position: absolute; left: 16px; right: 16px; bottom: 22px; border-left: 3px solid #8a6d16; padding: 9px 12px; background: rgba(255,252,244,0.6);">
    <div style="font-size: 11.5px; line-height: 1.5; color: rgba(13,13,13,0.7);">O drop cai no chão com a sua cor e é apanhado ao passar por cima. A etiqueta grita consoante a raridade — uma comum quase não se vê, uma divina para-te a corrida.</div>
  </div>
</div>
</x-dc>
</body>
</html>
