name: Jianying · Android APK

# The build machine that writes this game has no Android SDK and no route to
# dl.google.com, so the APK cannot be produced there. GitHub's runners have
# both, which makes this workflow the only path from source to something
# installable — and the reason it is set up in phase 0, before any gameplay
# exists, rather than left until the end.

on:
  push:
    branches:
      - 'claude/**'
      - main
    paths:
      - 'jianying/**'
      - '.github/workflows/jianying-android.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: jianying

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Needed to publish the rolling release below. Nothing else is written.
    permissions:
      contents: write
    env:
      # Absolute path to the decrypted signing key. Gradle is pointed at this
      # explicitly rather than left to find ~/.android/debug.keystore on its
      # own: two builds proved it does not, and every build came out with a
      # different signature.
      JIANYING_DEBUG_KEYSTORE: ${{ github.workspace }}/jianying/ci/debug.keystore

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: jianying/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build web bundle
        run: npx vite build

      # Java 21 is what Android Gradle Plugin 8.7+ expects; 17 still works but
      # warns, and the runner ships both.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Capacitor 8 generates a project on AGP 8.13 / Gradle 8.14.3 targeting
      # compileSdk 36, so those components have to be present and licensed.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Generate the native Android project
        # android/ is not vendored — it is fully derived from capacitor.config.ts
        # plus dist/, so generating it here keeps the repo free of a large tree
        # of files nobody edits by hand. Guarded so a cached or pre-existing
        # platform does not fail the run.
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android

          # Pin debug signing to our own keystore. Capacitor's generated
          # build.gradle declares no debug signingConfig, so AGP falls back to a
          # default location it resolves on its own — and on this runner that
          # resolution does not land on ~/.android/debug.keystore, which is why
          # restoring the key there changed nothing. An explicit path removes
          # the guesswork. Groovy allows several android {} blocks, so this
          # appends cleanly to a generated file.
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file(System.getenv("JIANYING_DEBUG_KEYSTORE"))
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          GRADLE

      # Every runner is disposable, so Gradle would create a BRAND NEW
      # ~/.android/debug.keystore on each build. Android treats two APKs signed
      # with different keys as different apps, so installing an update over the
      # previous build fails with "App not installed" and the phone silently
      # keeps running the old version — which is exactly what happened.
      #
      # Restoring one fixed keystore makes every build a real update. The
      # keystore lives in the repo encrypted; only the passphrase is a secret,
      # so setting this up is one short paste rather than 3KB of base64.
      - name: Restore the stable debug keystore
        env:
          PASSPHRASE: ${{ secrets.DEBUG_KEYSTORE_PASSPHRASE }}
        run: |
          # This FAILS rather than warns when the passphrase is missing. The
          # first version only warned, and the resulting APK looked completely
          # healthy — green build, correct code inside — while being signed with
          # a throwaway key, so it refused to install over the previous build and
          # the phone silently kept running old code. A red build is far cheaper
          # than that, and this is the only step that can detect it.
          if [ -z "$PASSPHRASE" ]; then
            echo "::error::DEBUG_KEYSTORE_PASSPHRASE nao esta definido neste repositorio."
            echo "::error::Sem ele o APK e assinado com uma chave nova e NAO instala por cima do anterior."
            echo "::error::Define-o em Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in ci/debug.keystore.enc \
            -out "$JIANYING_DEBUG_KEYSTORE" \
            -pass "pass:$PASSPHRASE"
          # The fingerprint is public information, and printing it is what makes
          # "is this build signed with the stable key?" answerable from the log.
          keytool -list -v -keystore "$JIANYING_DEBUG_KEYSTORE" \
            -storepass android -alias androiddebugkey \
            | grep "SHA256:" || {
              echo "::error::A keystore desencriptou mas nao contem androiddebugkey."
              exit 1
            }
          echo "Keystore estavel restaurada."

      - name: Assemble debug APK
        working-directory: jianying/android
        run: ./gradlew --no-daemon assembleDebug

      # The check that would have caught all of this on the first build instead
      # of the third: an APK signed with the wrong key looks completely healthy
      # from the outside — green build, correct code inside — and only reveals
      # itself as "App nao instalada" on a phone, or worse, as a phone silently
      # still running the previous version.
      - name: Verify the APK carries the stable signature
        run: |
          EXPECTED=$(keytool -list -v -keystore "$JIANYING_DEBUG_KEYSTORE" \
            -storepass android -alias androiddebugkey \
            | sed -n 's/.*SHA256: //p' | head -1)
          ACTUAL=$(python3 ci/apk_cert_fingerprint.py \
            android/app/build/outputs/apk/debug/app-debug.apk)

          echo "esperado: $EXPECTED"
          echo "no APK:   $ACTUAL"

          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::O APK nao foi assinado com a keystore estavel."
            echo "::error::Este APK nao instalaria por cima do anterior, por isso nao vai ser publicado."
            exit 1
          fi
          echo "Assinatura confirmada."

      - name: Name the APK with the commit
        id: rename
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/jianying-${GITHUB_SHA::7}.apk"
          echo "name=jianying-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rename.outputs.name }}
          path: jianying/out/*.apk
          if-no-files-found: error
          retention-days: 30

      # A GitHub artifact is a zip and needs a logged-in session to fetch, which
      # makes installing from a phone a seven-step chore. A release asset on a
      # public repo is a direct .apk link with no login and no unzip — so the
      # install becomes: open link, tap, install.
      #
      # The tag is fixed rather than per-commit, so the link never changes and
      # each build replaces the previous APK in place.
      - name: Publish the rolling install link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="jianying-latest"
          APK="out/${{ steps.rename.outputs.name }}.apk"

          NOTES=$(cat <<'MD'
          APK de desenvolvimento do 剑影 Jiànyǐng, reconstruido a cada alteracao.
          Este link e sempre o mais recente.

          **Instalar:** toca no ficheiro `.apk` abaixo. Na primeira vez o Android
          pede para permitires instalacao desta origem, e o Play Protect avisa —
          e um build de debug nao assinado para loja, por isso o aviso e esperado.
          MD
          )

          # `gh release create` fails if the tag already exists, so delete the
          # previous release first. The tag itself is recreated by --target.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$APK" \
            --title "剑影 Jiànyǐng · build mais recente" \
            --notes "$NOTES" \
            --prerelease \
            --target "$GITHUB_SHA"

      - name: Summary
        run: |
          {
            echo "### APK pronto"
            echo ""
            echo "**Instala num toque:**"
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/jianying-latest"
            echo ""
            echo "Abre esse link no telemovel, toca no \`.apk\` e instala."
            echo "Nao precisas de login nem de extrair zip nenhum."
            echo ""
            echo "O mesmo APK esta tambem em **Artifacts** como \`${{ steps.rename.outputs.name }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
