name: Lineage · Web

on:
  push:
    branches: [claude/mobile-idle-coop-game-fevn5j]
    paths: ['lineage/**', '.github/workflows/lineage-web.yml']
  pull_request:
    paths: ['lineage/**']
  workflow_dispatch:

defaults:
  run:
    working-directory: lineage

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lineage/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: lineage-web
          path: lineage/dist
          if-no-files-found: error
