name: Lineage · Android APK

on:
  push:
    branches: [claude/mobile-idle-coop-game-fevn5j]
    paths: ['lineage/**', '.github/workflows/lineage-android.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: lineage

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lineage/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install
        run: npm ci

      - name: Typecheck, test and build the web bundle
        run: |
          npm test
          npm run build

      - name: Copy the bundle into the Android project
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: lineage/android
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: lineage-debug-apk
          path: lineage/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
