name: Android APK

on:
  push:
    branches: [claude/mobile-idle-coop-game-fevn5j]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install
        run: npm ci

      - name: Typecheck, test and build the web bundle
        run: |
          npm test
          npm run build

      - name: Copy the bundle into the Android project
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Name it after the commit
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/lineage-${GITHUB_SHA::7}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk out/lineage-latest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lineage-apk
          path: out/*.apk
          if-no-files-found: error

      # A release asset under a fixed tag gives one URL that never rots, so a link
      # handed over today still works after the next push.
      - name: Publish to the rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lineage-latest
          name: Lineage · latest build
          body: |
            Debug APK built from `${{ github.sha }}`.

            Stable download (always the newest build):
            https://github.com/${{ github.repository }}/releases/download/lineage-latest/lineage-latest.apk

            Unsigned debug build — Android will warn about an unknown source.
            Enable "install unknown apps" for your browser or file manager to install it.
          files: out/*.apk
          make_latest: true
